/* WebOS window manager: create, focus, drag, resize, snap, minimize, maximize, close */
'use strict';

(() => {
  const wm = OS.wm = { windows: new Map(), z: 10, active: null, cascade: 0 };
  const area = () => document.getElementById('windows');
  const snapEl = () => document.getElementById('snap-preview');

  const CTRL_ICONS = {
    min: '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg>',
    max: '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    restore: '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 4V2.5h5.5V8H8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    close: '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4"/></svg>',
  };

  wm.list = () => [...wm.windows.values()];
  wm.byApp = appId => wm.list().filter(w => w.app === appId);
  wm.topmost = () => wm.list().filter(w => !w.minimized).sort((a, b) => b.z - a.z)[0] || null;

  wm.create = function (opts = {}) {
    const A = area().getBoundingClientRect();
    const small = A.width < 700;
    const width = Math.min(opts.width || 640, A.width - 16);
    const height = Math.min(opts.height || 460, A.height - 16);
    const off = (wm.cascade++ % 8) * 28 - 98;
    let x = opts.x ?? Math.round((A.width - width) / 2 + off);
    let y = opts.y ?? Math.round((A.height - height) / 2 + off * 0.6);
    x = U.clamp(x, 0, Math.max(0, A.width - width));
    y = U.clamp(y, 0, Math.max(0, A.height - height));

    const el = U.h('div', {
      class: 'win opening' + (opts.className ? ' ' + opts.className : '') + (opts.dialog ? ' dialog' : ''),
      role: 'dialog',
      style: { left: x + 'px', top: y + 'px', width: width + 'px', height: height + 'px' },
    });
    el.innerHTML = `
      <div class="win-titlebar">
        <span class="win-icon"></span><span class="win-title"></span>
        <div class="win-controls">
          ${opts.dialog ? '' : `<button class="wc wc-min" title="Minimize">${CTRL_ICONS.min}</button>`}
          ${opts.resizable === false ? '' : `<button class="wc wc-max" title="Maximize">${CTRL_ICONS.max}</button>`}
          <button class="wc wc-close" title="Close">${CTRL_ICONS.close}</button>
        </div>
      </div>
      <div class="win-body"></div>`;
    if (opts.resizable !== false) {
      for (const d of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) el.appendChild(U.h('div', { class: 'rz rz-' + d, 'data-dir': d }));
    }
    const body = el.querySelector('.win-body');

    const win = {
      id: 'w' + U.uid(), el, body, app: opts.app || null, opts, z: 0,
      title: opts.title || 'Window', icon: opts.icon || 'file',
      minimized: false, maximized: false, focused: false, closed: false,
      minWidth: opts.minWidth || 240, minHeight: opts.minHeight || 140,
      _cleanup: [], _resize: [], beforeClose: null,
      noTaskbar: !!opts.noTaskbar,

      setTitle(t) { win.title = t; el.querySelector('.win-title').textContent = t; OS.bus.emit('wm:change'); },
      setIcon(i) { win.icon = i; el.querySelector('.win-icon').innerHTML = OS.icons.tile(i, 18); OS.bus.emit('wm:change'); },

      focus() {
        if (win.closed) return;
        if (win.minimized) win.restoreMin();
        if (wm.active && wm.active !== win) wm.active.blur();
        win.z = ++wm.z;
        el.style.zIndex = win.z;
        if (!win.focused) {
          win.focused = true;
          el.classList.add('focused');
          wm.active = win;
          win.onFocus && win.onFocus();
          OS.bus.emit('wm:change');
        }
      },
      blur() {
        if (!win.focused) return;
        win.focused = false;
        el.classList.remove('focused');
        if (wm.active === win) wm.active = null;
        win.onBlur && win.onBlur();
        OS.bus.emit('wm:change');
      },
      minimize() {
        if (win.minimized) return;
        win.minimized = true;
        el.classList.add('minimized');
        win.blur();
        const next = wm.topmost();
        next && next.focus();
        OS.bus.emit('wm:change');
      },
      restoreMin() {
        win.minimized = false;
        el.classList.remove('minimized');
        OS.bus.emit('wm:change');
      },
      maximize() {
        if (win.maximized) return;
        win._prev = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
        win.maximized = true;
        el.classList.add('maximized');
        const b = el.querySelector('.wc-max');
        if (b) { b.innerHTML = CTRL_ICONS.restore; b.title = 'Restore'; }
        win._fireResize();
      },
      unmaximize() {
        if (!win.maximized) return;

    /** Three-way: resolves 'yes' | 'no' | null(cancel) */
    ask(msg, { title = 'Question', yes = 'Yes', no = 'No', cancel = 'Cancel' } = {}) {
      return base(title, 'about', (win, finish) => {
        win.body.append(U.h('div', { class: 'dlg-msg' }, msg), buttons(finish, [[cancel, null], [no, 'no'], [yes, 'yes', true]]));
        win.onKey(e => { if (e.key === 'Escape') finish(null); });
      });
    },
    prompt(msg, def = '', { title = 'Input', icon = 'about', type = 'text', placeholder = '' } = {}) {
      return base(title, icon, (win, finish) => {
        const inp = U.h('input', { class: 'input', type, value: def, placeholder });
        win.body.append(U.h('div', { class: 'dlg-msg' }, U.h('label', {}, msg), inp),
          buttons(finish, [['Cancel', null], ['OK', () => inp.value, true]]));
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(inp.value); if (e.key === 'Escape') finish(null); });
        setTimeout(() => {
          inp.focus();
          const dot = def.lastIndexOf('.');
          dot > 0 ? inp.setSelectionRange(0, dot) : inp.select();
        }, 50);
      });
    },
    /** File picker. mode 'open' | 'save' | 'folder'. Returns path or null */
    file({ mode = 'open', title, start = '/Documents', name = '', exts = null } = {}) {
      const fs = OS.fs;
      if (!fs.isDir(start)) start = '/';
      return base(title || (mode === 'save' ? 'Save As' : mode === 'folder' ? 'Choose Folder' : 'Open'), 'files', (win, finish) => {
        let cwd = start, selected = null;
        const pathEl = U.h('div', { class: 'fp-path' });
        const list = U.h('div', { class: 'fp-list' });
        const nameInp = U.h('input', { class: 'input', value: name, placeholder: 'File name' });
        const places = ['/', '/Desktop', '/Documents', '/Pictures', '/Music', '/Videos', '/Downloads'];
        const side = U.h('div', { class: 'fp-side' }, places.map(p => U.h('div', {
          class: 'fp-place', onclick: () => go(p),
          html: OS.icons.tile(p === '/' ? 'drive' : OS.icons.forFile(U.basename(p), true), 18) + `<span>${p === '/' ? 'Home' : U.basename(p)}</span>`,
        })));
        const go = p => { cwd = p; selected = null; render(); };
        const okPath = () => {
          if (mode === 'folder') return selected && fs.isDir(selected) ? selected : cwd;
          if (mode === 'open') return selected && fs.isFile(selected) ? selected : null;
          const nm = nameInp.value.trim();
          if (!nm || !OS.VFS.validName(nm)) return null;
          return U.join(cwd, nm);
        };
        const submit = async () => {
          if (mode === 'open' && selected && fs.isDir(selected)) return go(selected);
          const p = okPath();
          if (!p) { OS.sound.play('error'); return; }
          if (mode === 'save' && fs.exists(p)) {
            if (fs.isDir(p)) return go(p);
            if (!(await OS.dialog.confirm(`"${U.basename(p)}" already exists. Replace it?`, { title: 'Confirm Save As', ok: 'Replace' }))) return;
          }
          finish(p);
        };
        const render = () => {
          pathEl.innerHTML = '';
          U.append(pathEl, U.h('button', { class: 'btn icon-btn', title: 'Up', onclick: () => go(U.dirname(cwd)), disabled: cwd === '/' }, '↑'),
            U.h('span', {}, cwd === '/' ? 'Home' : cwd),
            mode !== 'open' ? U.h('button', {
              class: 'btn', style: { marginLeft: 'auto' }, onclick: async () => {
                const n = await OS.dialog.prompt('Folder name', 'New folder', { title: 'New Folder' });
                if (n) { try { fs.mkdir(U.join(cwd, n)); render(); } catch (e) { OS.dialog.alert(e.message); } }
              },
            }, '+ Folder') : null);
          list.innerHTML = '';
          let items = [];
          try { items = fs.list(cwd); } catch { /* ignore */ }
          if (exts && mode !== 'folder') items = items.filter(i => i.isDir || exts.includes(U.ext(i.name)));
          if (mode === 'folder') items = items.filter(i => i.isDir);
          if (!items.length) list.appendChild(U.h('div', { class: 'fp-empty' }, 'Empty folder'));
          for (const it of items) {
            const row = U.h('div', {
              class: 'fp-item' + (selected === it.path ? ' sel' : ''),
              html: OS.icons.tile(OS.icons.forFile(it.name, it.isDir), 20) + `<span>${U.esc(it.name)}</span><small>${it.isDir ? '' : U.fmtBytes(it.size)}</small>`,
            });
            row.onclick = () => { selected = it.path; if (!it.isDir) nameInp.value = it.name; render(); };
            row.ondblclick = () => { if (it.isDir) go(it.path); else { selected = it.path; submit(); } };
            list.appendChild(row);
          }
        };
        nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        U.append(win.body, U.h('div', { class: 'fp' }, side, U.h('div', { class: 'fp-main' }, pathEl, list)),
          mode === 'save' ? U.h('div', { class: 'fp-name' }, U.h('label', {}, 'Name'), nameInp) : null,
          buttons(finish, [['Cancel', null], [mode === 'save' ? 'Save' : mode === 'folder' ? 'Select' : 'Open', null, true]]));
        win.body.querySelector('.dlg-buttons .primary').onclick = submit;
        win.onKey(e => { if (e.key === 'Escape') finish(null); });
        render();
      }, { width: 600, height: mode === 'save' ? 460 : 420 });
    },
  };
})();

/* ---------- Background services (alarms / reminders) ---------- */
OS.services = {
  start() {
    this.stop();
    this._t = setInterval(() => this.tick(), 1000);
  },
  stop() { clearInterval(this._t); },
  tick() {
    if (!OS.user) return;
    const now = new Date();
    if (now.getSeconds() !== 0) return;
    const hm = U.pad(now.getHours()) + ':' + U.pad(now.getMinutes());
    const alarms = OS.data.get('alarms', []);
    let changed = false;
    for (const a of alarms) {
      if (!a.on || a.time !== hm) continue;
      const day = now.getDay();
      if (a.days && a.days.length && !a.days.includes(day)) continue;
      OS.sound.play('alarm');
      OS.notify({ title: 'Alarm', body: `${a.label || 'Alarm'} — ${hm}`, icon: 'clock', timeout: 15000, sound: false, action: () => OS.launch('clock', { tab: 'alarm' }) });
      if (!a.days || !a.days.length) { a.on = false; changed = true; }
    }
    if (changed) { OS.data.set('alarms', alarms); OS.bus.emit('alarms:change'); }
    // Calendar reminders at event time
    const ymd = `${now.getFullYear()}-${U.pad(now.getMonth() + 1)}-${U.pad(now.getDate())}`;
    const events = OS.data.get('calendar', {})[ymd] || [];
    for (const ev of events) if (ev.time === hm) OS.notify({ title: 'Event: ' + ev.title, body: ev.time + (ev.note ? ' — ' + ev.note : ''), icon: 'calendar', timeout: 12000, action: () => OS.launch('calendar', { date: ymd }) });
  },
};

/* ---------- Reusable UI widgets ---------- */
OS.ui = {
  /** Menu bar: [{label, items: () => menuItems | menuItems}] */
  menubar(menus) {
    const bar = U.h('div', { class: 'menubar' });
    let openIdx = -1;
    const openAt = (i, btn) => {
      const r = btn.getBoundingClientRect();
      const m = menus[i];
      OS.menu(r.left, r.bottom + 2, typeof m.items === 'function' ? m.items() : m.items);
      openIdx = i;
      bar.querySelectorAll('.mb-item').forEach((b, k) => b.classList.toggle('open', k === i));
      const watch = setInterval(() => { if (!OS.menu.isOpen()) { clearInterval(watch); openIdx = -1; bar.querySelectorAll('.mb-item').forEach(b => b.classList.remove('open')); } }, 100);
    };
    menus.forEach((m, i) => {
      const b = U.h('button', { class: 'mb-item' }, m.label);
      b.addEventListener('pointerdown', e => { e.stopPropagation(); if (openIdx === i) { OS.menu.close(); openIdx = -1; } else openAt(i, b); });
      b.addEventListener('pointerenter', () => { if (openIdx !== -1 && openIdx !== i) openAt(i, b); });
      bar.appendChild(b);
    });
    return bar;
  },
  /** Generic overlay message for games: returns {show(title, text, btnLabel, onClick), hide()} */
  overlay(parent) {
    const el = U.h('div', { class: 'game-overlay', hidden: true });
    parent.appendChild(el);
    return {
      el,
      show(title, text, buttons = []) {
        el.innerHTML = '';
        el.append(U.h('div', { class: 'go-box' }, U.h('h2', {}, title), text ? U.h('p', {}, text) : null,
          U.h('div', { class: 'go-btns' }, buttons.map(([label, fn, primary]) => U.h('button', { class: 'btn' + (primary !== false ? ' primary' : ''), onclick: fn }, label)))));
        el.hidden = false;
        const b = el.querySelector('button');
        b && setTimeout(() => b.focus(), 30);
      },
      hide() { el.hidden = true; },
      get visible() { return !el.hidden; },
    };
  },
  /** High score helpers (per user) */
  best(game, score, lowerIsBetter = false) {
    const key = 'best.' + game;
    const cur = OS.data.get(key, null);
    if (score == null) return cur;
    if (cur == null || (lowerIsBetter ? score < cur : score > cur)) { OS.data.set(key, score); return score; }
    return cur;
  },
};

/** Game scaffold: bar + stage + crisp canvas scaled to fit. Returns helpers. */
OS.ui.game = (win, { w, h, bar = [] } = {}) => {
  const scoreEl = U.h('span', { class: 'gb-score' });
  const bestEl = U.h('span', { class: 'gb-best' });
  const barEl = U.h('div', { class: 'game-bar' }, scoreEl, bestEl, U.h('span', { style: { flex: 1 } }), ...bar);
  const stage = U.h('div', { class: 'game-stage' });
  const root = U.h('div', { class: 'game' }, barEl, stage);
  win.body.appendChild(root);
  const overlay = OS.ui.overlay(stage);
  const g = { root, bar: barEl, stage, overlay, scoreEl, bestEl, w, h, scale: 1 };
  if (w && h) {
    const canvas = U.h('canvas', { class: 'game-canvas' });
    const ctx = canvas.getContext('2d');
    stage.insertBefore(canvas, overlay.el);
    g.canvas = canvas;
    g.ctx = ctx;
    g.fit = () => {
      const W = stage.clientWidth - 16, H = stage.clientHeight - 16;
      if (W <= 0 || H <= 0) return;
      const s = Math.max(0.1, Math.min(W / w, H / h));
      const dpr = window.devicePixelRatio || 1;
      g.scale = s;
      canvas.style.width = Math.floor(w * s) + 'px';
      canvas.style.height = Math.floor(h * s) + 'px';
      canvas.width = Math.floor(w * s * dpr);
      canvas.height = Math.floor(h * s * dpr);
      ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
      g.onFit && g.onFit();
    };
    /** pointer position in logical coordinates */
    g.pos = e => {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * w, y: (e.clientY - r.top) / r.height * h };
    };
    win.onResize(g.fit);
    requestAnimationFrame(g.fit);
  }
  g.setScore = (label, best) => { scoreEl.textContent = label; bestEl.textContent = best != null ? best : ''; };
  /** Swipe detection on an element: cb('up'|'down'|'left'|'right') */
  g.swipe = (el, cb) => {
    let sx, sy;
    el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      sx = null;
    }, { passive: true });
  };
  return g;
};

  <script>/* js/core/fileops.js */
/* Shared file operations used by the desktop, Files app and others */
'use strict';

OS.fileOps = {
  clipboard: null, // { mode: 'copy'|'cut', paths: [] }

  copy(paths) { this.clipboard = { mode: 'copy', paths: [...paths] }; OS.bus.emit('clipboard'); },
  cut(paths) { this.clipboard = { mode: 'cut', paths: [...paths] }; OS.bus.emit('clipboard'); },

  paste(dir) {
    const cb = this.clipboard, fs = OS.fs;
    if (!cb) return;
    const errors = [];
    for (const p of cb.paths) {
      try {
        if (!fs.exists(p)) continue;
        if (cb.mode === 'cut') {
          if (U.dirname(p) === dir) continue;
          fs.move(p, U.join(dir, fs.uniqueName(dir, U.basename(p))));
        } else {
          fs.copy(p, U.join(dir, fs.uniqueName(dir, U.basename(p))));
        }
      } catch (e) { errors.push(e.message); }
    }
    if (cb.mode === 'cut') this.clipboard = null;
    OS.bus.emit('clipboard');
    if (errors.length) OS.dialog.alert(errors.join('\n'), { title: 'Paste' });
  },

  /** Move paths into a folder; dropping into the trash trashes them */
  moveInto(paths, dest) {
    const fs = OS.fs, errors = [];
    for (const p of paths) {
      try {
        if (p === dest || U.dirname(p) === dest) continue;
        if (dest === '/.Trash') fs.trash(p);
        else {
          fs.move(p, U.join(dest, fs.uniqueName(dest, U.basename(p))));
          const n = fs.node(U.join(dest, U.basename(p)));
          if (n) delete n.o;
        }
      } catch (e) { errors.push(e.message); }
    }
    if (errors.length) OS.dialog.alert(errors.join('\n'), { title: 'Move' });
  },

  async remove(paths, { permanent = false } = {}) {
    const fs = OS.fs;
    if (!paths.length) return;
    const inTrash = paths.every(p => p.startsWith('/.Trash/'));
    if (permanent || inTrash) {
      const ok = await OS.dialog.confirm(`Permanently delete ${paths.length === 1 ? '"' + U.basename(paths[0]) + '"' : paths.length + ' items'}? This cannot be undone.`, { title: 'Delete', ok: 'Delete', danger: true, icon: 'trash' });
      if (!ok) return;
      paths.forEach(p => { try { fs.remove(p); } catch (e) { console.warn(e); } });
    } else {
      paths.forEach(p => { try { fs.trash(p); } catch (e) { OS.dialog.alert(e.message); } });
    }
  },

  async rename(path) {
    const fs = OS.fs;
    const name = await OS.dialog.prompt('New name', U.basename(path), { title: 'Rename', icon: OS.icons.forFile(U.basename(path), fs.isDir(path)) });
    if (!name || name === U.basename(path)) return null;
    try { return fs.rename(path, name.trim()); } catch (e) { OS.dialog.alert(e.message, { title: 'Rename' }); return null; }
  },

  async newFolder(dir) {
    const fs = OS.fs;
    const name = await OS.dialog.prompt('Folder name', fs.uniqueName(dir, 'New folder'), { title: 'New Folder', icon: 'folder' });
    if (!name) return null;
    try { return fs.mkdir(U.join(dir, name.trim())); } catch (e) { OS.dialog.alert(e.message); return null; }
  },

  async newFile(dir, def = 'New text document.txt', content = '') {
    const fs = OS.fs;
    const name = await OS.dialog.prompt('File name', fs.uniqueName(dir, def), { title: 'New File', icon: 'filetext' });
    if (!name) return null;
    try {
      const p = U.join(dir, name.trim());
      if (fs.exists(p)) throw new Error('A file with that name already exists');
      return fs.write(p, content);
    } catch (e) { OS.dialog.alert(e.message); return null; }
  },

  download(path) {
    const fs = OS.fs;
    if (fs.isDir(path)) {
      // Export folder as a JSON bundle
      const node = fs.node(path);
      U.download(U.basename(path) + '.webos.json', new Blob([JSON.stringify(node)], { type: 'application/json' }));
      return;
    }
    U.download(U.basename(path), fs.read(path));
  },

  properties(path) {
    const fs = OS.fs, st = fs.stat(path);
    if (!st) return;
    const win = OS.wm.create({ title: st.name + ' Properties', icon: OS.icons.forFile(st.name, st.isDir), width: 360, height: 330, resizable: false, dialog: true });
    const row = (k, v) => U.h('tr', {}, U.h('td', {}, k), U.h('td', {}, v));
    win.body.append(U.h('div', { class: 'props' },
      U.h('div', { class: 'props-head', html: OS.icons.tile(OS.icons.forFile(st.name, st.isDir), 48) + `<b>${U.esc(st.name)}</b>` }),
      U.h('table', {},
        row('Type', st.isDir ? 'Folder' : (U.ext(st.name).toUpperCase() || 'Unknown') + ' file'),
        row('Location', U.dirname(st.path)),
        row('Size', U.fmtBytes(st.size) + (st.isDir ? ` (${st.count} items)` : '')),
        row('Modified', U.fmtDate(st.mtime)),
        st.origin ? row('Original location', st.origin) : null,
        !st.isDir ? row('Opens with', (OS.appsForFile(path).filter(a => !a.exts.includes('*'))[0] || { name: 'Notepad' }).name) : null),
      U.h('div', { class: 'dlg-buttons' }, U.h('button', { class: 'btn primary', onclick: () => win.close() }, 'OK'))));
  },

  /** Context menu items for a selection of paths */
  menuItems(paths, { onOpen, dir } = {}) {
    const fs = OS.fs;
    const one = paths.length === 1 ? paths[0] : null;
    const isDir = one && fs.isDir(one);
    const inTrash = paths.every(p => p.startsWith('/.Trash/'));
    if (inTrash) {
      return [
        { label: 'Restore', icon: 'files', action: () => paths.forEach(p => { try { fs.restore(p); } catch (e) { OS.dialog.alert(e.message); } }) },
        '-',
        { label: 'Delete permanently', icon: 'trash', action: () => this.remove(paths, { permanent: true }) },
        one ? { label: 'Properties', action: () => this.properties(one) } : null,
      ];
    }
    const openWith = one && !isDir ? OS.appsForFile(one).map(a => ({ label: a.name, icon: a.icon, action: () => OS.openFile(one, a.id) })) : [];
    return [
      { label: 'Open', icon: isDir ? 'folder' : null, action: () => (onOpen ? onOpen(paths) : paths.forEach(p => OS.openFile(p))) },
      openWith.length ? { label: 'Open with', submenu: openWith } : null,
      one && !isDir && U.imageExts.includes(U.ext(one)) ? { label: 'Set as wallpaper', icon: 'photos', action: () => OS.settings.set('wallpaper', { type: 'image', path: one }) } : null,
      '-',
      { label: 'Cut', shortcut: 'Ctrl+X', action: () => this.cut(paths) },
      { label: 'Copy', shortcut: 'Ctrl+C', action: () => this.copy(paths) },
      isDir && this.clipboard ? { label: 'Paste into folder', action: () => this.paste(one) } : null,
      '-',
      one ? { label: 'Rename', shortcut: 'F2', action: () => this.rename(one) } : null,
      { label: 'Delete', shortcut: 'Del', icon: 'trash', action: () => this.remove(paths) },
      '-',
      one ? { label: isDir ? 'Export folder' : 'Download', icon: 'downloads', action: () => this.download(one) } : null,
      one && !isDir && dir !== '/Desktop' ? { label: 'Create shortcut on Desktop', action: () => fs.write(U.join('/Desktop', fs.uniqueName('/Desktop', U.stripExt(U.basename(one)) + '.lnk')), one) } : null,
      one ? { label: 'Properties', action: () => this.properties(one) } : null,
    ];
  },
};

/* WebOS shell: desktop icons, taskbar, start menu, action center, calendar flyout */
'use strict';

OS.shell = (() => {
  const $ = id => document.getElementById(id);
  let started = false;
  const offs = [];

  /* ======================= Desktop ======================= */
  const Desktop = {
    selected: new Set(),
    cell() {
      const s = OS.settings.get('iconSize');
      return s === 'small' ? { w: 76, h: 84 } : s === 'large' ? { w: 108, h: 118 } : { w: 90, h: 100 };
    },
    items() {
      const fs = OS.fs;
      const apps = OS.settings.get('desktopApps').filter(id => OS.apps[id]).map(id => ({
        key: 'app:' + id, name: OS.apps[id].name, icon: OS.apps[id].icon, app: id,
        drop: id === 'trash' ? '/.Trash' : null,
      }));
      let files = [];
      try {
        files = fs.list('/Desktop').map(st => {
          let icon = OS.icons.forFile(st.name, st.isDir), name = st.name, thumb = null;
          if (U.ext(st.name) === 'lnk') {
            const t = fs.read(st.path).trim();
            name = U.stripExt(st.name);
            icon = t.startsWith('app:') ? (OS.apps[t.slice(4)] || {}).icon || 'file' : OS.icons.forFile(U.basename(t), fs.isDir(t));
          } else if (U.imageExts.includes(U.ext(st.name)) && st.size < 3e6) thumb = fs.read(st.path);
          return { key: 'file:' + st.path, name, icon, thumb, path: st.path, isDir: st.isDir, drop: st.isDir ? st.path : null };
        });
      } catch { /* ignore */ }
      return [...apps, ...files];
    },
    render() {
      const root = $('desktop-icons');
      root.innerHTML = '';
      const { w, h } = this.cell();
      const rows = Math.max(1, Math.floor((root.clientHeight - 8) / h));
      const pos = OS.settings.get('iconPositions');
      const taken = new Set();
      const items = this.items();
      const placed = [];
      for (const it of items) {
        const p = pos[it.key];
        if (p && p.r < rows && !taken.has(p.c + ',' + p.r)) { taken.add(p.c + ',' + p.r); placed.push([it, p]); }
        else placed.push([it, null]);
      }
      let c = 0, r = 0;
      for (const pair of placed) {
        if (pair[1]) continue;
        while (taken.has(c + ',' + r)) { r++; if (r >= rows) { r = 0; c++; } }
        pair[1] = { c, r };
        taken.add(c + ',' + r);
      }
      for (const [it, p] of placed) {
        const el = U.h('div', {
          class: 'dicon' + (this.selected.has(it.key) ? ' sel' : ''),
          tabindex: 0, 'data-key': it.key,
          style: { left: (8 + p.c * w) + 'px', top: (8 + p.r * h) + 'px', width: (w - 6) + 'px' },
        },
        U.h('div', { class: 'dicon-img', html: it.thumb ? `<img src="${it.thumb}" alt="">` : OS.icons.tile(it.icon, w > 100 ? 56 : w < 80 ? 38 : 46) }),
        U.h('div', { class: 'dicon-label' }, it.name));
        if (it.drop) el.dataset.dropPath = it.drop;
        el._item = it;
        el._pos = p;
        this.bindIcon(el, it);
        root.appendChild(el);
      }
    },
    open(it) {
      if (it.app) OS.launch(it.app);
      else OS.openFile(it.path);
    },
    selectOnly(key) {
      this.selected = new Set(key ? [key] : []);
      document.querySelectorAll('.dicon').forEach(e => e.classList.toggle('sel', this.selected.has(e.dataset.key)));
    },
    selectedPaths() {
      return [...this.selected].filter(k => k.startsWith('file:')).map(k => k.slice(5));
    },
    bindIcon(el, it) {
      el.addEventListener('dblclick', () => this.open(it));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') this.open(it);

        }
      });
      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;

        el.setPointerCapture(e.pointerId);
        const move = ev => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;

          if (!dragging) { dragging = true; icons.forEach(i => i.classList.add('dragging')); document.body.classList.add('dragging'); }
          icons.forEach((i, k) => { i.style.left = starts[k][0] + dx + 'px'; i.style.top = starts[k][1] + dy + 'px'; });
          document.querySelectorAll('.drop-hover').forEach(d => d.classList.remove('drop-hover'));
          const t = document.elementFromPoint(ev.clientX, ev.clientY);
          const target = t && t.closest('[data-drop-path]');
          if (target && !icons.includes(target)) target.classList.add('drop-hover');
        };
        const up = ev => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
          el.removeEventListener('pointercancel', up);
          document.body.classList.remove('dragging');
          document.querySelectorAll('.drop-hover').forEach(d => d.classList.remove('drop-hover'));
          if (!dragging) return;
          icons.forEach(i => i.classList.remove('dragging'));
          const t = document.elementFromPoint(ev.clientX, ev.clientY);
          const target = t && t.closest('[data-drop-path]');
          const paths = icons.map(i => i._item.path).filter(Boolean);
          if (target && !icons.includes(target) && paths.length) {
            const dest = target.dataset.dropPath;
            if (dest !== '/Desktop') { OS.fileOps.moveInto(paths, dest); return; }
          }
          if (t && t.closest('.win')) { this.render(); return; }
          // Reposition on grid
          const { w, h } = this.cell();
          const root = $('desktop-icons');
          const rows = Math.max(1, Math.floor((root.clientHeight - 8) / h));
          const cols = Math.max(1, Math.floor((root.clientWidth - 8) / w));
          const pos = { ...OS.settings.get('iconPositions') };
          const occupied = new Map();
          document.querySelectorAll('.dicon').forEach(d => { if (!icons.includes(d)) occupied.set(d._pos.c + ',' + d._pos.r, d.dataset.key); });
          icons.forEach(i => {
            let c = U.clamp(Math.round((i.offsetLeft - 8) / w), 0, cols - 1);
            let r = U.clamp(Math.round((i.offsetTop - 8) / h), 0, rows - 1);
            let guard = 0;
            while (occupied.has(c + ',' + r) && guard++ < 500) { r++; if (r >= rows) { r = 0; c = (c + 1) % cols; } }
            occupied.set(c + ',' + r, i.dataset.key);
            pos[i.dataset.key] = { c, r };
          });
          OS.settings.set('iconPositions', pos);
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);

        U.h('div', { class: 'cf-events' }, U.h('b', {}, 'Today'), todays.length ? todays.map(ev => U.h('div', { class: 'cf-ev' }, `${ev.time || 'All day'} · ${ev.title}`)) : U.h('div', { class: 'muted' }, 'No events today')));
    },
  };

  /* ======================= Lifecycle ======================= */
  function start() {
    if (!started) {
      started = true;
      Desktop.bindBackground();
      $('start-btn').onclick = e => { e.stopPropagation(); Start.toggle(); };
      $('tb-clock').onclick = e => { e.stopPropagation(); Cal.toggle(); };
      $('tb-notif').onclick = e => { e.stopPropagation(); Action.toggle(); };
      $('tb-desktop').onclick = () => {
        const visible = OS.wm.list().filter(w => !w.minimized);
        if (visible.length) { Taskbar._shown = visible; OS.wm.minimizeAll(); }
        else if (Taskbar._shown) { Taskbar._shown.filter(w => !w.closed).forEach(w => w.focus()); Taskbar._shown = null; }
      };
      document.addEventListener('pointerdown', e => {
        if (!overlayOpen()) return;
        if (e.target.closest('#start-menu, #action-center, #cal-flyout, #start-btn, #tb-clock, #tb-notif, .ctx-menu')) return;
        closeOverlays();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && overlayOpen()) closeOverlays();
        // Ctrl+Space or Alt+Space opens start menu
        if ((e.ctrlKey || e.altKey) && e.code === 'Space' && OS.user && !OS.session.locked) { e.preventDefault(); Start.toggle(); }
      });
      $('desktop-icons').addEventListener('click', () => {});
      window.addEventListener('resize', U.debounce(() => started && OS.user && Desktop.render(), 150));
      setInterval(() => OS.user && Taskbar.clock(), 1000);
    }
    offs.push(
      OS.bus.on('wm:change', () => Taskbar.render()),
      OS.bus.on('fs:change', paths => { if (paths.some(p => p === '/Desktop' || p.startsWith('/Desktop/'))) Desktop.render(); }),
      OS.bus.on('settings:change', k => {
        if (['desktopApps', 'iconPositions', 'iconSize'].includes(k)) Desktop.render();
        if (k === 'pinned') Taskbar.render();
        if (k === 'clock24' || k === 'showSeconds') Taskbar.clock();
        if ($('action-center').classList.contains('open') && ['theme', 'sounds', 'dnd', 'animations', 'transparency'].includes(k)) Action.render();
      }),
      OS.bus.on('notify', () => updateBadge()),
    );
    Desktop.selected = new Set();
    Desktop.render();
    Taskbar.render();
    Taskbar.clock();
    updateBadge();
  }

  function stop() {
    offs.splice(0).forEach(off => off());
    closeOverlays();
    $('desktop-icons').innerHTML = '';
    $('tb-apps').innerHTML = '';
  }

  return { start, stop, Desktop, Taskbar, Start, closeOverlays, overlayOpen, toggleFullscreen };
})();

  <script>/* js/core/session.js */
/* WebOS session: boot screen, accounts, login/lock screen, sign out, power */
'use strict';

OS.accounts = {
  all() { return OS.storage.get('users', {}); },
  get(u) { return this.all()[u] || null; },
  save(users) { OS.storage.set('users', users); },
  async create({ username, name, password = '', color }) {
    username = (username || '').trim().toLowerCase();
    if (!/^[a-z0-9_.-]{1,24}$/.test(username)) throw new Error('Username may only contain letters, numbers, dot, dash and underscore (max 24).');
    const users = this.all();
    if (users[username]) throw new Error('That username is already taken.');
    const salt = U.uid();
    users[username] = {
      name: (name || username).trim().slice(0, 40), salt,
      hash: password ? await U.sha256(salt + password) : '',
      color: color || ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#ef4444', '#06b6d4'][Object.keys(users).length % 7],
      created: Date.now(),
    };
    this.save(users);
    return users[username];
  },
  async verify(username, password) {
    const u = this.get(username);
    if (!u) return false;
    if (!u.hash) return true;
    return (await U.sha256(u.salt + password)) === u.hash;
  },
  async setPassword(username, password) {
    const users = this.all();
    const u = users[username];
    u.salt = U.uid();
    u.hash = password ? await U.sha256(u.salt + password) : '';
    this.save(users);
  },
  update(username, patch) {
    const users = this.all();
    Object.assign(users[username], patch);
    this.save(users);
    if (OS.user && OS.user.username === username) Object.assign(OS.user, patch);
  },
  async remove(username) {
    const users = this.all();
    delete users[username];
    this.save(users);
    await OS.idb.del('fs:' + username);
    OS.storage.keys('settings.' + username).concat(OS.storage.keys('data.' + username + '.'), OS.storage.keys('assoc.' + username)).forEach(k => OS.storage.remove(k));
  },
};

OS.session = (() => {
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let clockTimer = null;

  async function boot() {
    const b = $('boot');
    b.hidden = false;
    const bar = b.querySelector('.boot-bar i');
    const msg = b.querySelector('.boot-msg');
    const steps = ['Loading kernel…', 'Mounting file system…', 'Starting services…', 'Loading apps (' + Object.keys(OS.apps).length + ')…', 'Ready'];
    for (let i = 0; i < steps.length; i++) {
      msg.textContent = steps[i];
      bar.style.width = ((i + 1) / steps.length * 100) + '%';
      await sleep(i === steps.length - 1 ? 150 : 260);
    }
    b.classList.add('fade');
    await sleep(350);
    b.hidden = true;
    b.classList.remove('fade');
    showLogin();
  }

  /* ---------- Login / lock screen ---------- */
  function showLogin({ lock = false } = {}) {
    const L = $('login');
    L.hidden = false;
    L.className = lock ? 'lock' : '';
    L.innerHTML = '';
    const users = OS.accounts.all();
    const names = Object.keys(users);
    const clock = U.h('div', { class: 'login-clock' }, U.h('div', { class: 'lc-time' }), U.h('div', { class: 'lc-date' }));
    const tickClock = () => {
      const n = new Date();
      clock.firstChild.textContent = n.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      clock.lastChild.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    };
    tickClock();
    clearInterval(clockTimer);
    clockTimer = setInterval(tickClock, 1000);
    const panel = U.h('div', { class: 'login-panel' });
    L.append(clock, panel);

    if (lock) return renderUser(panel, OS.user.username, true);
    const last = OS.storage.get('lastUser');
    if (!names.length) return renderCreate(panel, true);
    renderUser(panel, names.includes(last) ? last : names[0]);
    {
      const list = U.h('div', { class: 'login-users' },
        names.map(n => U.h('button', { class: 'lu', onclick: () => renderUser(panel, n) },
          U.h('span', { class: 'avatar', style: { background: users[n].color } }, (users[n].name || n)[0].toUpperCase()),
          U.h('span', {}, users[n].name || n))),
        U.h('button', { class: 'lu', onclick: () => renderCreate(panel) }, U.h('span', { class: 'avatar add' }, '+'), U.h('span', {}, 'New account')));
      L.append(list);
    }
  }

  function renderUser(panel, username, lock = false) {
    const u = OS.accounts.get(username);
    panel.innerHTML = '';
    const err = U.h('div', { class: 'login-err' });
    const pass = U.h('input', { class: 'input', type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
    const go = async () => {
      const ok = await OS.accounts.verify(username, pass.value);
      if (!ok) {
        err.textContent = 'Incorrect password. Try again.';
        panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
        OS.sound.play('error');
        pass.select();
        return;
      }
      if (lock) unlock(); else login(username);
    };
    pass.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    U.append(panel,
      U.h('div', { class: 'avatar big', style: { background: u.color } }, (u.name || username)[0].toUpperCase()),
      U.h('div', { class: 'login-name' }, u.name || username),
      u.hash
        ? U.h('div', { class: 'login-row' }, pass, U.h('button', { class: 'btn primary arrow', onclick: go, title: 'Sign in' }, '→'))
        : U.h('button', { class: 'btn primary wide', onclick: go }, lock ? 'Unlock' : 'Sign in'),
      err,
      lock ? U.h('button', { class: 'btn link', onclick: () => { unlock(true); logout(); } }, 'Switch user') : null);
    setTimeout(() => (u.hash ? pass : panel.querySelector('button.primary')).focus(), 60);
  }

  function renderCreate(panel, first = false) {
    panel.innerHTML = '';
    const err = U.h('div', { class: 'login-err' });
    const name = U.h('input', { class: 'input', placeholder: 'Your name', autocomplete: 'name' });
    const user = U.h('input', { class: 'input', placeholder: 'Username', autocomplete: 'username' });
    const pass = U.h('input', { class: 'input', type: 'password', placeholder: 'Password (optional)', autocomplete: 'new-password' });
    const pass2 = U.h('input', { class: 'input', type: 'password', placeholder: 'Confirm password', autocomplete: 'new-password' });
    let userEdited = false;
    user.oninput = () => { userEdited = true; };
    name.oninput = () => { if (!userEdited) user.value = name.value.toLowerCase().replace(/[^a-z0-9_.-]/g, '').slice(0, 24); };
    const go = async () => {
      err.textContent = '';
      if (!user.value.trim()) { err.textContent = 'Please choose a username.'; return; }
      if (pass.value !== pass2.value) { err.textContent = 'Passwords do not match.'; return; }
      try {
        await OS.accounts.create({ username: user.value, name: name.value || user.value, password: pass.value });
        login(user.value.trim().toLowerCase());
      } catch (e) { err.textContent = e.message; OS.sound.play('error'); }
    };
    [name, user, pass, pass2].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
    U.append(panel,
      U.h('div', { class: 'avatar big add' }, '+'),
      U.h('div', { class: 'login-name' }, first ? `Welcome to ${OS.name}` : 'Create account'),
      first ? U.h('p', { class: 'login-sub' }, 'Create an account to get started. Your files and settings are saved privately in this browser.') : null,
      U.h('div', { class: 'login-form' }, name, user, pass, pass2),
      U.h('button', { class: 'btn primary wide', onclick: go }, 'Create account'),
      err,
      !first ? U.h('button', { class: 'btn link', onclick: () => showLogin() }, 'Back') : null);
    setTimeout(() => name.focus(), 60);
  }

  async function login(username) {
    const L = $('login');
    const u = OS.accounts.get(username);
    OS.user = Object.assign({ username }, u);
    OS.storage.set('lastUser', username);
    OS.settings.load();
    L.classList.add('fade');
    OS.fs = await OS.VFS.open(username);
    OS.applySettings();
    clearInterval(clockTimer);
    await sleep(300);
    L.hidden = true;
    L.classList.remove('fade');
    $('shell').hidden = false;
    OS.shell.start();
    OS.services.start();
    OS.sound.play('startup');
    const first = !OS.data.get('welcomed', false);
    if (first) {
      OS.data.set('welcomed', true);
      setTimeout(() => OS.notify({ title: `Welcome, ${OS.user.name}!`, body: 'Click here for a quick tour of WebOS.', icon: 'logo', timeout: 9000, sound: false, action: () => OS.openFile('/Desktop/Welcome.txt') }), 900);
    }
    OS.bus.emit('session:login');
  }

  let locked = false;
  function lock() {
    if (!OS.user) return;
    locked = true;
    OS.session.locked = true;
    showLogin({ lock: true });
  }
  function unlock(silent) {
    locked = false;
    OS.session.locked = false;
    clearInterval(clockTimer);
    $('login').hidden = true;
    if (!silent) OS.sound.play('pop');
  }

  async function logout() {
    try { await endSession(); } catch { return; }
    showLogin();
  }

  async function endSession() {
    if (!OS.user) return;
    // Give apps a chance to save (e.g. unsaved documents)
    for (const w of OS.wm.list()) {
      w.focus();
      await w.close();
      if (!w.closed) return Promise.reject(new Error('cancelled'));
    }
    OS.services.stop();
    await OS.fs.flush();
    OS.shell.stop();
    $('shell').hidden = true;
    OS.user = null;
    OS.fs = null;
    OS.notifications.length = 0;
    document.documentElement.dataset.theme = 'dark';
  }

  async function power(mode) {
    try { if (OS.user) await endSession(); } catch { return; }
    OS.sound.play('shutdown');
    const P = $('power-screen');
    P.hidden = false;
    $('login').hidden = true;
    P.innerHTML = `<div class="spinner"></div><div>${mode === 'restart' ? 'Restarting…' : 'Shutting down…'}</div>`;
    await sleep(1400);
    if (mode === 'restart') { location.reload(); return; }
    P.innerHTML = '';
    P.append(U.h('div', { class: 'off-msg' }, 'It is now safe to turn off your computer.'),
      U.h('button', { class: 'power-on', title: 'Power on', onclick: () => location.reload(), html: '<svg viewBox="0 0 24 24" width="40" height="40"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></g></svg>' }));
  }

  // Save on tab close
  window.addEventListener('beforeunload', () => { if (OS.fs) OS.fs.flush(); });
  window.addEventListener('pagehide', () => { if (OS.fs) OS.fs.flush(); });

  return { boot, login, logout, lock, unlock, power, locked: false, showLogin };
})();

  <script>/* js/apps/files.js */
/* Files — file explorer */
'use strict';

(() => {
  const PLACES = [
    ['/', 'Home', 'drive'], ['/Desktop', 'Desktop', 'desktop'], ['/Documents', 'Documents', 'documents'],
    ['/Pictures', 'Pictures', 'pictures'], ['/Music', 'Music', 'music'], ['/Videos', 'Videos', 'video'],
    ['/Downloads', 'Downloads', 'downloads'], ['/.Trash', 'Trash', 'trash'],
  ];

  function launchFiles(win, args) {
    const fs = OS.fs;
    let cwd = '/', history = [], hidx = -1, sel = new Set(), anchor = null;
    let view = OS.data.get('files.view', 'grid'), query = '';

    const back = U.h('button', { class: 'btn icon-btn', title: 'Back (Alt+←)', onclick: () => goHist(-1) }, '←');
    const fwd = U.h('button', { class: 'btn icon-btn', title: 'Forward (Alt+→)', onclick: () => goHist(1) }, '→');
    const up = U.h('button', { class: 'btn icon-btn', title: 'Up (Backspace)', onclick: () => cwd !== '/' && go(U.dirname(cwd)) }, '↑');
    const crumbs = U.h('div', { class: 'fx-crumbs' });
    const search = U.h('input', { class: 'input fx-search', placeholder: 'Search', type: 'search' });
    const actions = U.h('div', { class: 'toolbar fx-actions' });
    const side = U.h('div', { class: 'app-side fx-side' });
    const main = U.h('div', { class: 'fx-main', tabindex: 0 });
    const status = U.h('div', { class: 'statusbar' });

    win.body.append(
      U.h('div', { class: 'toolbar' }, back, fwd, up, crumbs, search),
      actions,
      U.h('div', { class: 'app-split' }, side, main),
      status);

    search.addEventListener('input', () => { query = search.value.trim(); render(); });

    function go(path, push = true) {
      path = fs.resolve(path);
      if (!fs.isDir(path)) { OS.dialog.alert(`Folder not found: ${path}`); return; }
      cwd = path;
      sel.clear();
      query = '';
      search.value = '';
      if (push) { history = history.slice(0, hidx + 1); history.push(path); hidx = history.length - 1; }
      render();
    }
    function goHist(d) {
      const n = hidx + d;
      if (n < 0 || n >= history.length) return;
      hidx = n;
      go(history[hidx], false);
    }

    function selectedPaths() { return [...sel]; }

    function open(paths) {
      for (const p of paths) {
        if (fs.isDir(p)) { go(p); return; }
        OS.openFile(p);
      }
    }

    function renderSide() {
      side.innerHTML = '';
      for (const [p, label, icon] of PLACES) {
        side.appendChild(U.h('div', {
          class: 'fx-place' + (cwd === p ? ' active' : ''), 'data-drop-path': p,
          html: OS.icons.tile(icon, 20) + `<span>${label}</span>`, onclick: () => go(p),
        }));
      }
      const used = fs.usage();
      side.appendChild(U.h('div', { class: 'fx-usage' },
        U.h('small', {}, 'Storage used'),
        U.h('div', { class: 'meter' }, U.h('i', { style: { width: Math.min(100, used / (50 * 1024 * 1024) * 100) + '%' } })),
        U.h('small', {}, U.fmtBytes(used))));
      bindDrops(side);
    }

    function renderActions() {
      actions.innerHTML = '';
      const inTrash = cwd === '/.Trash';
      if (inTrash) {
        actions.append(
          U.h('button', { class: 'btn', disabled: !sel.size, onclick: () => { selectedPaths().forEach(p => fs.restore(p)); } }, '↺ Restore'),
          U.h('button', { class: 'btn danger', onclick: () => OS.apps.trash.empty() }, 'Empty Trash'));
      } else {
        actions.append(
          U.h('button', { class: 'btn', onclick: () => OS.fileOps.newFolder(cwd) }, '+ Folder'),
          U.h('button', { class: 'btn', onclick: () => OS.fileOps.newFile(cwd).then(p => p && OS.openFile(p)) }, '+ File'),
          U.h('button', { class: 'btn', title: 'Import files from your computer', onclick: async () => { const f = await U.pickHostFiles(); if (f.length) fs.importFiles(f, cwd); } }, '⇪ Upload'),
          U.h('span', { class: 'sep' }),
          U.h('button', { class: 'btn icon-btn', title: 'Cut', disabled: !sel.size, onclick: () => OS.fileOps.cut(selectedPaths()) }, '✂'),
          U.h('button', { class: 'btn icon-btn', title: 'Copy', disabled: !sel.size, onclick: () => OS.fileOps.copy(selectedPaths()) }, '⧉'),
          U.h('button', { class: 'btn icon-btn', title: 'Paste', disabled: !OS.fileOps.clipboard, onclick: () => OS.fileOps.paste(cwd) }, '📋'),
          U.h('button', { class: 'btn icon-btn', title: 'Rename', disabled: sel.size !== 1, onclick: () => OS.fileOps.rename(selectedPaths()[0]) }, '✎'),
          U.h('button', { class: 'btn icon-btn', title: 'Delete', disabled: !sel.size, onclick: () => OS.fileOps.remove(selectedPaths()) }, '🗑'));
      }
      actions.append(U.h('span', { style: { flex: 1 } }),
        U.h('button', { class: 'btn icon-btn' + (view === 'grid' ? ' active' : ''), title: 'Icons', onclick: () => setView('grid') }, '▦'),
        U.h('button', { class: 'btn icon-btn' + (view === 'list' ? ' active' : ''), title: 'Details', onclick: () => setView('list') }, '☰'));
    }
    function setView(v) { view = v; OS.data.set('files.view', v); render(); }

    function renderCrumbs() {
      crumbs.innerHTML = '';
      const parts = cwd.split('/').filter(Boolean);
      const mk = (label, path) => U.h('button', { class: 'crumb', 'data-drop-path': path, onclick: () => go(path) }, label);
      crumbs.append(mk('Home', '/'));
      let acc = '';
      for (const p of parts) {
        acc += '/' + p;
        crumbs.append(U.h('span', { class: 'crumb-sep' }, '›'), mk(p === '.Trash' ? 'Trash' : p, acc));
      }
      crumbs.ondblclick = async e => {
        if (e.target !== crumbs) return;
        const p = await OS.dialog.prompt('Go to folder', cwd, { title: 'Location' });
        if (p) go(fs.resolve(p, cwd));
      };
    }

    function render() {
      if (!fs.isDir(cwd)) cwd = '/';
      win.setTitle((cwd === '/' ? 'Home' : cwd === '/.Trash' ? 'Trash' : U.basename(cwd)) + ' — Files');
      back.disabled = hidx <= 0;
      fwd.disabled = hidx >= history.length - 1;
      up.disabled = cwd === '/';
      renderSide();
      renderActions();
      renderCrumbs();
      main.innerHTML = '';
      main.className = 'fx-main fx-' + view;
      main.dataset.dropPath = cwd;
      let items;
      try {
        items = query ? fs.find(query, cwd) : fs.list(cwd, { hidden: OS.settings.get('showHidden') || cwd === '/.Trash' });
      } catch (e) { main.textContent = e.message; return; }
      [...sel].forEach(p => { if (!fs.exists(p)) sel.delete(p); });
      if (view === 'list') {
        main.appendChild(U.h('div', { class: 'fx-row fx-head' }, U.h('span', {}, 'Name'), U.h('span', {}, cwd === '/.Trash' ? 'Original location' : 'Modified'), U.h('span', {}, 'Type'), U.h('span', {}, 'Size')));
      }
      if (!items.length) main.appendChild(U.h('div', { class: 'empty-state' }, query ? 'No matching files' : cwd === '/.Trash' ? 'Trash is empty' : 'This folder is empty.\nDrag files here from your computer to import them.'));
      for (const it of items) {
        const icon = OS.icons.forFile(it.name, it.isDir);
        const isImg = !it.isDir && U.imageExts.includes(U.ext(it.name)) && it.size < 4e6;
        const thumb = isImg ? `<img src="${fs.read(it.path)}" alt="" loading="lazy">` : OS.icons.tile(icon, view === 'grid' ? 48 : 20);
        const el = view === 'grid'
          ? U.h('div', { class: 'fx-item', draggable: true, html: `<div class="fx-thumb">${thumb}</div><div class="fx-name">${U.esc(it.name)}</div>` })
          : U.h('div', { class: 'fx-row fx-item', draggable: true, html: `<span class="fx-name">${thumb}<span>${U.esc(it.name)}</span></span><span>${cwd === '/.Trash' ? U.esc(it.origin || '') : U.fmtDate(it.mtime)}</span><span>${it.isDir ? 'Folder' : (U.ext(it.name).toUpperCase() || 'File')}</span><span>${it.isDir ? it.count + ' items' : U.fmtBytes(it.size)}</span>` });
        el.dataset.path = it.path;
        if (it.isDir) el.dataset.dropPath = it.path;
        if (sel.has(it.path)) el.classList.add('sel');
        if (OS.fileOps.clipboard && OS.fileOps.clipboard.mode === 'cut' && OS.fileOps.clipboard.paths.includes(it.path)) el.classList.add('cut');
        el.addEventListener('click', e => {
          e.stopPropagation();
          if (e.shiftKey && anchor) {
            const all = items.map(i => i.path);
            const a = all.indexOf(anchor), b = all.indexOf(it.path);
            sel = new Set(all.slice(Math.min(a, b), Math.max(a, b) + 1));
          } else if (e.ctrlKey || e.metaKey) {
            sel.has(it.path) ? sel.delete(it.path) : sel.add(it.path);
            anchor = it.path;
          } else { sel = new Set([it.path]); anchor = it.path; }
          updateSel();
        });
        el.addEventListener('dblclick', () => open([it.path]));
        el.addEventListener('contextmenu', e => {
          e.preventDefault();
          e.stopPropagation();
          if (!sel.has(it.path)) { sel = new Set([it.path]); updateSel(); }
          OS.menu(e.clientX, e.clientY, OS.fileOps.menuItems(selectedPaths(), { onOpen: open, dir: cwd }));
        });
        el.addEventListener('dragstart', e => {

    main.addEventListener('click', e => { if (e.target === main) { sel.clear(); updateSel(); } });
    main.addEventListener('contextmenu', e => {
      if (e.target.closest('.fx-item')) return;

      if (cwd === '/.Trash') {

        return;
      }
      OS.menu(e.clientX, e.clientY, [
        { label: 'New', submenu: [
          { label: 'Folder', icon: 'folder', action: () => OS.fileOps.newFolder(cwd) },
          { label: 'Text Document', icon: 'filetext', action: () => OS.fileOps.newFile(cwd) },
          { label: 'Web Page', icon: 'filecode', action: () => OS.fileOps.newFile(cwd, 'page.html', '<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello!</h1>\n</body>\n</html>\n') },
        ] },
        { label: 'Paste', shortcut: 'Ctrl+V', disabled: !OS.fileOps.clipboard, action: () => OS.fileOps.paste(cwd) },
        { label: 'Upload files…', icon: 'downloads', action: async () => fs.importFiles(await U.pickHostFiles(), cwd) },
        '-',
        { label: 'View', submenu: [{ label: 'Icons', checked: view === 'grid', action: () => setView('grid') }, { label: 'Details', checked: view === 'list', action: () => setView('list') }] },
        { label: 'Show hidden files', checked: OS.settings.get('showHidden'), action: () => { OS.settings.set('showHidden', !OS.settings.get('showHidden')); render(); } },
        { label: 'Refresh', action: render },
        '-',
        { label: 'Open in Terminal', icon: 'terminal', action: () => OS.launch('terminal', { cwd }) },
        { label: 'Properties', action: () => OS.fileOps.properties(cwd) },
      ]);
    });

    win.onKey(e => {
      if (e.target === search || e.target.tagName === 'INPUT') return;
      const ctrl = e.ctrlKey || e.metaKey;
      const paths = selectedPaths();
      if (e.key === 'Enter' && paths.length) open(paths);
      else if (e.key === 'Delete' && paths.length) OS.fileOps.remove(paths, { permanent: e.shiftKey });
      else if (e.key === 'F2' && paths.length === 1) OS.fileOps.rename(paths[0]);
      else if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowUp')) { e.preventDefault(); if (cwd !== '/') go(U.dirname(cwd)); }
      else if (e.altKey && e.key === 'ArrowLeft') goHist(-1);
      else if (e.altKey && e.key === 'ArrowRight') goHist(1);
      else if (ctrl && e.key === 'a') { e.preventDefault(); sel = new Set([...main.querySelectorAll('.fx-item')].map(x => x.dataset.path)); updateSel(); }
      else if (ctrl && e.key === 'c' && paths.length) OS.fileOps.copy(paths);
      else if (ctrl && e.key === 'x' && paths.length) OS.fileOps.cut(paths);
      else if (ctrl && e.key === 'v') OS.fileOps.paste(cwd);
      else if (ctrl && e.key === 'f') { e.preventDefault(); search.focus(); }
      else if (e.key === 'F5') { e.preventDefault(); render(); }
    });

    const rerender = U.debounce(render, 30);
    win.sub('fs:change', rerender);
    win.sub('clipboard', rerender);
    win.sub('settings:change', k => k === 'showHidden' && rerender());

    let start = args.path || '/';
    if (fs.isFile(start)) { const f = start; start = U.dirname(f); go(start); sel = new Set([f]); updateSel(); }
    else go(start);
  }

  OS.registerApp({
    id: 'files', name: 'Files', icon: 'files', category: 'System', width: 820, height: 520, minWidth: 420,
    desc: 'Browse and manage your files', keywords: 'explorer finder folder',
    launch: launchFiles,
  });

  OS.registerApp({
    id: 'trash', name: 'Trash', icon: 'trash', category: 'System', width: 760, height: 460, hidden: true,
    launch: (win, args) => launchFiles(win, { path: '/.Trash' }),
    async empty() {
      const n = OS.fs.list('/.Trash', { hidden: true }).length;
      if (!n) return OS.dialog.alert('The Trash is already empty.', { title: 'Trash', icon: 'trash' });
      if (await OS.dialog.confirm(`Permanently delete ${n} item(s) in the Trash?`, { title: 'Empty Trash', ok: 'Empty Trash', danger: true, icon: 'trash' })) {
        OS.fs.emptyTrash();
        OS.sound.play('pop');
      }
    },
  });
})();

/* Notepad — plain text & markdown editor */
'use strict';

OS.registerApp({
  id: 'notepad', name: 'Notepad', icon: 'notepad', category: 'Apps', width: 720, height: 500,
  desc: 'Edit text and Markdown files', keywords: 'text editor write markdown',
  exts: ['txt', 'md', 'log', 'csv', 'ini', 'cfg', 'json', 'xml', 'yml', 'yaml', 'toml', '*'],
  launch(win, args) {
    const fs = OS.fs;
    let path = null, dirty = false, wrap = OS.data.get('notepad.wrap', true), size = OS.data.get('notepad.size', 15), preview = false;

    const ta = U.h('textarea', { class: 'np-text', spellcheck: false, placeholder: 'Start typing…' });
    const prev = U.h('div', { class: 'np-preview md', hidden: true });
    const status = U.h('div', { class: 'statusbar' });
    const findBar = U.h('div', { class: 'toolbar np-find', hidden: true });
    const findInp = U.h('input', { class: 'input', placeholder: 'Find' });
    const replInp = U.h('input', { class: 'input', placeholder: 'Replace with' });
    const findInfo = U.h('small', { class: 'muted' });
    findBar.append(findInp, replInp,
      U.h('button', { class: 'btn', onclick: () => find(1) }, 'Next'),
      U.h('button', { class: 'btn', onclick: () => find(-1) }, 'Prev'),
      U.h('button', { class: 'btn', onclick: () => replace(false) }, 'Replace'),
      U.h('button', { class: 'btn', onclick: () => replace(true) }, 'All'),
      findInfo,
      U.h('button', { class: 'btn icon-btn', style: { marginLeft: 'auto' }, onclick: () => { findBar.hidden = true; ta.focus(); } }, '✕'));

    const isMd = () => path && ['md', 'markdown'].includes(U.ext(path));
    const menubar = OS.ui.menubar([
      { label: 'File', items: () => [
        { label: 'New', shortcut: 'Ctrl+N', action: newDoc },
        { label: 'New window', action: () => OS.launch('notepad') },
        { label: 'Open…', shortcut: 'Ctrl+O', action: openDoc },
        { label: 'Save', shortcut: 'Ctrl+S', action: save },
        { label: 'Save as…', shortcut: 'Ctrl+Shift+S', action: saveAs },
        '-',
        { label: 'Download to computer', disabled: false, action: () => U.download(path ? U.basename(path) : 'untitled.txt', ta.value) },
        { label: 'Print', action: printDoc },
        '-',
        { label: 'Close', action: () => win.close() },
      ] },
      { label: 'Edit', items: () => [
        { label: 'Undo', shortcut: 'Ctrl+Z', action: () => { ta.focus(); document.execCommand('undo'); } },
        { label: 'Redo', shortcut: 'Ctrl+Y', action: () => { ta.focus(); document.execCommand('redo'); } },
        '-',
        { label: 'Find & replace', shortcut: 'Ctrl+F', action: showFind },
        { label: 'Select all', shortcut: 'Ctrl+A', action: () => { ta.focus(); ta.select(); } },
        { label: 'Insert time/date', shortcut: 'F5', action: insertDate },
        '-',
        { label: 'UPPERCASE selection', action: () => transform(s => s.toUpperCase()) },
        { label: 'lowercase selection', action: () => transform(s => s.toLowerCase()) },
        { label: 'Sort lines', action: () => { ta.value = ta.value.split('\n').sort((a, b) => a.localeCompare(b)).join('\n'); changed(); } },
      ] },
      { label: 'View', items: () => [
        { label: 'Word wrap', checked: wrap, action: () => { wrap = !wrap; OS.data.set('notepad.wrap', wrap); applyView(); } },
        { label: 'Zoom in', shortcut: 'Ctrl++', action: () => zoom(1) },
        { label: 'Zoom out', shortcut: 'Ctrl+-', action: () => zoom(-1) },
        { label: 'Reset zoom', action: () => { size = 15; applyView(); } },
        '-',
        { label: 'Markdown preview', checked: preview, action: togglePreview },
      ] },
    ]);
    const prevBtn = U.h('button', { class: 'btn small', onclick: togglePreview, style: { marginLeft: 'auto', marginRight: '8px' } }, 'Preview');
    menubar.appendChild(prevBtn);

    win.body.append(menubar, findBar, U.h('div', { class: 'np-wrap' }, ta, prev), status);

    function applyView() {
      ta.style.whiteSpace = wrap ? 'pre-wrap' : 'pre';
      ta.style.overflowX = wrap ? 'hidden' : 'auto';
      ta.style.fontSize = size + 'px';
      prev.style.fontSize = size + 'px';
      OS.data.set('notepad.size', size);
      prevBtn.style.display = isMd() ? '' : 'none';
    }
    function zoom(d) { size = U.clamp(size + d, 9, 40); applyView(); }
    function togglePreview() {
      preview = !preview;
      prev.hidden = !preview;
      ta.hidden = preview;
      prevBtn.classList.toggle('active', preview);
      if (preview) prev.innerHTML = U.markdown(ta.value);
      else ta.focus();
    }
    function title() {
      win.setTitle((dirty ? '• ' : '') + (path ? U.basename(path) : 'Untitled') + ' — Notepad');
    }
    function updateStatus() {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.split('\n').length, col = before.length - before.lastIndexOf('\n');

      status.textContent = `Ln ${line}, Col ${col}   •   ${ta.value.length} characters   •   ${words} words   •   ${path || 'Not saved'}`;
    }
    function changed() { if (!dirty) { dirty = true; title(); } updateStatus(); }
    function load(p) {
      try {
        ta.value = fs.read(p);
        path = fs.resolve(p);
        dirty = false;
        title(); updateStatus(); applyView();
        if (preview) prev.innerHTML = U.markdown(ta.value);
        if (isMd() && !preview && ta.value.length) togglePreview();
      } catch (e) { OS.dialog.alert(e.message); }
    }
    async function confirmDiscard() {
      if (!dirty) return true;
      const r = await OS.dialog.ask(`Do you want to save changes to ${path ? U.basename(path) : 'Untitled'}?`, { title: 'Notepad', yes: 'Save', no: "Don't save" });
      if (r === 'yes') return await save();
      return r === 'no';
    }
    async function newDoc() { if (!(await confirmDiscard())) return; path = null; ta.value = ''; dirty = false; title(); updateStatus(); applyView(); }
    async function openDoc() {
      if (!(await confirmDiscard())) return;
      const p = await OS.dialog.file({ mode: 'open', start: path ? U.dirname(path) : '/Documents' });
      if (p) load(p);
    }
    async function save() {
      if (!path) return saveAs();
      try { fs.write(path, ta.value); dirty = false; title(); updateStatus(); return true; }
      catch (e) { OS.dialog.alert(e.message); return false; }
    }
    async function saveAs() {
      const p = await OS.dialog.file({ mode: 'save', start: path ? U.dirname(path) : '/Documents', name: path ? U.basename(path) : 'Untitled.txt' });
      if (!p) return false;
      path = p;
      const ok = await save();
      applyView();
      return ok;
    }
    function insertDate() {
      ta.focus();
      document.execCommand('insertText', false, new Date().toLocaleString());
    }
    function transform(fn) {
      const s = ta.selectionStart, e = ta.selectionEnd;
      if (s === e) return;
      ta.focus();
      document.execCommand('insertText', false, fn(ta.value.slice(s, e)));
      ta.setSelectionRange(s, e);
    }
    function printDoc() {
      const w = window.open('', '_blank');
      if (!w) return OS.dialog.alert('Allow pop-ups to print.');
      w.document.write(`<title>${U.esc(path ? U.basename(path) : 'Untitled')}</title><pre style="white-space:pre-wrap;font:13px monospace">${U.esc(ta.value)}</pre>`);
      w.document.close();
      w.print();
    }
    function showFind() {
      findBar.hidden = false;
      const s = ta.value.slice(ta.selectionStart, ta.selectionEnd);
      if (s && !s.includes('\n')) findInp.value = s;
      findInp.focus(); findInp.select();
    }
    function find(dir) {
      const q = findInp.value;
      if (!q) return;
      const text = ta.value.toLowerCase(), ql = q.toLowerCase();
      let idx = dir > 0 ? text.indexOf(ql, ta.selectionEnd) : text.lastIndexOf(ql, ta.selectionStart - 1);
      if (idx < 0) idx = dir > 0 ? text.indexOf(ql) : text.lastIndexOf(ql);
      const count = text.split(ql).length - 1;
      findInfo.textContent = count ? `${count} match${count > 1 ? 'es' : ''}` : 'No matches';
      if (idx < 0) return;
      ta.focus();
      ta.setSelectionRange(idx, idx + q.length);
      const lineH = size * 1.5;
      ta.scrollTop = Math.max(0, (ta.value.slice(0, idx).split('\n').length - 3) * lineH);
      findInp.focus();
    }
    function replace(all) {
      const q = findInp.value;
      if (!q) return;
      if (all) {
        const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        const n = (ta.value.match(re) || []).length;
        ta.focus(); ta.select();
        document.execCommand('insertText', false, ta.value.replace(re, replInp.value));
        findInfo.textContent = `Replaced ${n}`;
      } else {
        const selText = ta.value.slice(ta.selectionStart, ta.selectionEnd);
        if (selText.toLowerCase() === q.toLowerCase()) { ta.focus(); document.execCommand('insertText', false, replInp.value); }
        find(1);
      }
    }

    ta.addEventListener('input', changed);
    ['keyup', 'click', 'select'].forEach(ev => ta.addEventListener(ev, updateStatus));
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
    });
    findInp.addEventListener('keydown', e => { if (e.key === 'Enter') find(e.shiftKey ? -1 : 1); if (e.key === 'Escape') { findBar.hidden = true; ta.focus(); } });
    win.onKey(e => {
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); e.shiftKey ? saveAs() : save(); }
      else if (ctrl && e.key === 'o') { e.preventDefault(); openDoc(); }
      else if (ctrl && e.key === 'n') { e.preventDefault(); newDoc(); }
      else if (ctrl && (e.key === 'f' || e.key === 'h')) { e.preventDefault(); showFind(); }
      else if (ctrl && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoom(1); }
      else if (ctrl && e.key === '-') { e.preventDefault(); zoom(-1); }
      else if (e.key === 'F5') { e.preventDefault(); insertDate(); }
    });

    win.onFocus = () => setTimeout(() => { if (!findBar.contains(document.activeElement) && !preview) ta.focus(); }, 0);

    if (args.path) load(args.path);
    else { title(); updateStatus(); applyView(); }
    if (args.text) { ta.value = args.text; changed(); }
    setTimeout(() => ta.focus(), 50);
  },
});

      /* ----- file tree ----- */
      function renderTree() {

      /* ----- running ----- */
      function log(type, args) {

      const liveRun = U.debounce(run, 600);

        if (docs[active]) docs[active].content = ta.value;

  <script>/* js/apps/terminal.js */
/* Terminal — a bash-like shell over the virtual file system */
'use strict';

OS.registerApp({
  id: 'terminal', name: 'Terminal', icon: 'terminal', category: 'System', width: 760, height: 460,
  desc: 'Command line shell', keywords: 'shell bash console cli command prompt',
  exts: ['sh'],
  launch(win, args) {
    const fs = OS.fs;
    let cwd = args.cwd && fs.isDir(args.cwd) ? args.cwd : '/';
    const hist = OS.data.get('term.history', []);
    let hpos = hist.length, busy = false, cancel = null;
    const env = { USER: OS.user.username, HOME: '/', SHELL: '/bin/wsh', OS: OS.name };
    const aliases = Object.assign({ ll: 'ls -l', la: 'ls -a', cls: 'clear', dir: 'ls', nano: 'edit', vi: 'edit', vim: 'edit', type: 'cat', del: 'rm', copy: 'cp', move: 'mv', md: 'mkdir' }, OS.data.get('term.aliases', {}));

    const out = U.h('div', { class: 'term-out' });
    const promptEl = U.h('span', { class: 'term-prompt' });
    const inp = U.h('input', { class: 'term-in', spellcheck: false, autocomplete: 'off', autocapitalize: 'off' });
    const line = U.h('div', { class: 'term-line' }, promptEl, inp);
    const screen = U.h('div', { class: 'term' }, out, line);
    win.body.append(screen);
    screen.addEventListener('mouseup', () => { if (!window.getSelection().toString()) inp.focus(); });
    win.onFocus = () => setTimeout(() => inp.focus(), 0);

    const host = 'webos';
    const short = p => p;
    function setPrompt() {
      promptEl.innerHTML = `<span class="t-green">${U.esc(OS.user.username)}@${host}</span>:<span class="t-blue">${U.esc(short(cwd))}</span>$&nbsp;`;
    }
    function print(text, cls) {
      const el = U.h('div', { class: 'term-row' + (cls ? ' ' + cls : '') });
      if (typeof text === 'string') el.textContent = text; else el.append(text);
      out.appendChild(el);
      if (out.childElementCount > 2000) out.firstChild.remove();
      screen.scrollTop = screen.scrollHeight;
    }
    function printHTML(html) {
      const el = U.h('div', { class: 'term-row', html });
      out.appendChild(el);
      screen.scrollTop = screen.scrollHeight;
    }

    /* ---------- argument parsing ---------- */
    function tokenize(str) {
      const toks = [];
      let cur = '', q = null, has = false;
      for (let i = 0; i < str.length; i++) {
        const c = str[i];
        if (q) {
          if (c === q) q = null;
          else if (c === '\\' && q === '"' && i + 1 < str.length) cur += str[++i];
          else cur += c;
        } else if (c === '"' || c === "'") { q = c; has = true; }
        else if (c === '\\' && i + 1 < str.length) { cur += str[++i]; has = true; }
        else if (/\s/.test(c)) { if (cur || has) toks.push(cur); cur = ''; has = false; }
        else if (c === '|' || c === '>' || c === ';' || c === '&') {
          if (cur || has) toks.push(cur);
          cur = ''; has = false;
          if (c === '>' && str[i + 1] === '>') { toks.push({ op: '>>' }); i++; }
          else if (c === '&' && str[i + 1] === '&') { toks.push({ op: '&&' }); i++; }
          else toks.push({ op: c });
        } else { cur += c; has = true; }
      }
      if (q) throw new Error('unterminated quote');
      if (cur || has) toks.push(cur);
      return toks;
    }
    const expand = s => s.replace(/\$(\w+)/g, (m, k) => env[k] ?? '').replace(/^~(?=\/|$)/, '/');

      const f = new Set(), rest = [];
      for (const a of argv) {
        if (/^-[a-zA-Z]+$/.test(a)) [...a.slice(1)].forEach(c => f.add(c));
        else if (a.startsWith('--')) f.add(a.slice(2));
        else rest.push(a);

    }

    function glob(arg) {
      if (!/[*?]/.test(arg)) return [arg];
      const dir = arg.includes('/') ? arg.slice(0, arg.lastIndexOf('/') + 1) : '';
      const pat = arg.slice(dir.length);

      } catch { return [arg]; }
    }

    /* ---------- commands ---------- */
    const C = {};
    const help = {};
    const def = (name, desc, fn) => { C[name] = fn; help[name] = desc; };

    def('help', 'List available commands', (a, io) => {
      io.print('WebOS shell — available commands:', 't-bold');
      const names = Object.keys(help).sort();
      const w = Math.max(...names.map(n => n.length)) + 2;
      names.forEach(n => io.print('  ' + n.padEnd(w) + help[n]));

      io.print('Supports pipes (|), redirection (> >>), && and ;, wildcards (*), $VARS, Tab completion and ↑/↓ history.', 't-dim');

    def('echo', 'Print text', (a, io) => io.print(a.join(' ')));
    def('pwd', 'Print working directory', (a, io) => io.print(cwd));
    def('cd', 'Change directory', a => {
      const p = R(a[0] || '/');
      if (!fs.isDir(p)) throw new Error(`cd: ${a[0]}: No such directory`);
      cwd = p; setPrompt();
    });

    /* ---------- execution ---------- */
    function makeIO(stdin) {
      const segs = [];
      return {
        stdin: stdin || '',
        segs,
        print(text, cls, plain) { segs.push({ text, cls, plain: plain ?? (typeof text === 'string' ? text : text.textContent) }); },
        html(h, plain) { segs.push({ html: h, plain }); },
        get text() { return segs.map(s => s.plain).join('\n'); },
      };
    }
    function flush(io) {
      io.segs.forEach(s => s.html != null ? printHTML(s.html) : print(s.text, s.cls));
    }

    async function runPipeline(cmds, redirect) {
      let stdin = '', io;
      for (let i = 0; i < cmds.length; i++) {
        let [name, ...argv] = cmds[i];
        if (aliases[name]) { const t = tokenize(aliases[name]); name = t[0]; argv = [...t.slice(1), ...argv]; }
        argv = argv.map(expand);
        if (/^\w+=/.test(name) && !argv.length) { const [k, ...v] = name.split('='); env[k] = v.join('='); return; }
        const fn = C[name];
        if (!fn) {
          if (fs.isFile(R(name)) && U.ext(name) === 'sh') { io = makeIO(stdin); await C.sh([name], io); stdin = io.text; continue; }
          throw new Error(`${name}: command not found. Type 'help' for a list of commands.`);
        }
        io = makeIO(stdin);
        await fn(argv, io);
        stdin = io.text;
      }
      if (redirect) {
        const p = R(redirect.file);
        const text = io.text + (io.text ? '\n' : '');
        redirect.op === '>>' ? fs.append(p, text) : fs.write(p, text);
      } else if (io) flush(io);
    }

    async function execLine(lineStr, ioParent) {
      const toks = tokenize(lineStr.trim());
      // split on ; and &&
      const groups = [];
      let cur = [], sep = ';';
      for (const t of toks) {
        if (t && t.op && (t.op === ';' || t.op === '&&')) { groups.push({ toks: cur, sep }); cur = []; sep = t.op; }
        else cur.push(t);
      }
      groups.push({ toks: cur, sep });
      let ok = true;
      for (const g of groups) {
        if (g.sep === '&&' && !ok) continue;
        if (!g.toks.length) continue;
        const cmds = [[]];
        let redirect = null;
        for (let i = 0; i < g.toks.length; i++) {
          const t = g.toks[i];
          if (t && t.op === '|') cmds.push([]);
          else if (t && (t.op === '>' || t.op === '>>')) { redirect = { op: t.op, file: g.toks[++i] }; if (typeof redirect.file !== 'string') throw new Error('syntax error near redirection'); }
          else if (typeof t === 'string') cmds[cmds.length - 1].push(...(cmds[cmds.length - 1].length ? glob(expand(t)) : [t]));
        }
        try { await runPipeline(cmds.filter(c => c.length), redirect); ok = true; }
        catch (e) { ok = false; if (ioParent) throw e; print(e.message, e.message === '^C' ? 't-dim' : 't-red'); }
      }
    }

    async function submit() {
      const v = inp.value;
      inp.value = '';
      printHTML(promptEl.innerHTML + U.esc(v));
      if (v.trim()) {
        if (hist[hist.length - 1] !== v) { hist.push(v); if (hist.length > 300) hist.shift(); OS.data.set('term.history', hist); }
      }
      hpos = hist.length;
      if (!v.trim()) return;
      busy = true;
      line.style.visibility = 'hidden';
      try { await execLine(v); }
      catch (e) { print(e.message, 't-red'); }
      busy = false;
      cancel = null;
      line.style.visibility = '';
      setPrompt();
      inp.focus();
      screen.scrollTop = screen.scrollHeight;
    }

    function complete() {
      const v = inp.value.slice(0, inp.selectionStart);
      const parts = v.split(/\s+/);
      const word = parts[parts.length - 1];
      let cands;
      if (parts.length === 1) cands = [...Object.keys(C), ...Object.keys(aliases)].filter(c => c.startsWith(word)).map(c => c + ' ');
      else {
        const dirPart = word.includes('/') ? word.slice(0, word.lastIndexOf('/') + 1) : '';
        const base = word.slice(dirPart.length);
        try {
          cands = fs.list(R(dirPart || '.'), { hidden: base.startsWith('.') }).filter(s => s.name.toLowerCase().startsWith(base.toLowerCase())).map(s => dirPart + (s.name.includes(' ') ? s.name.replace(/ /g, '\\ ') : s.name) + (s.isDir ? '/' : ' '));
        } catch { cands = []; }
      }
      if (cands.length === 1) {
        inp.value = v.slice(0, v.length - word.length) + cands[0] + inp.value.slice(inp.selectionStart);
      } else if (cands.length > 1) {
        let pre = cands[0];
        cands.forEach(c => { while (!c.startsWith(pre)) pre = pre.slice(0, -1); });
        if (pre.length > word.length) inp.value = v.slice(0, v.length - word.length) + pre;
        else { printHTML(promptEl.innerHTML + U.esc(inp.value)); print(cands.map(c => c.trim()).join('   '), 't-dim'); }
      }
    }

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (!busy) submit(); }
      else if (e.key === 'Tab') { e.preventDefault(); complete(); }

    print(`Type 'help' to see available commands.`, 't-dim');
    print('');

'use strict';

(() => {
  /** Recursive-descent expression evaluator (no eval) */
  function evaluate(src, deg) {
    const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s+/g, '');
    let i = 0;
    const peek = () => s[i];
    const eat = c => { if (s[i] === c) { i++; return true; } return false; };
    const toRad = x => deg ? x * Math.PI / 180 : x;
    const fromRad = x => deg ? x * 180 / Math.PI : x;
    const FN = {
      sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
      asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
      ln: Math.log, log: Math.log10, sqrt: Math.sqrt, '√': Math.sqrt, abs: Math.abs, exp: Math.exp,
    };
    const fact = n => { if (n < 0 || n !== Math.floor(n)) return NaN; if (n > 170) return Infinity; let r = 1; for (let k = 2; k <= n; k++) r *= k; return r; };
    function expr() {
      let v = term();
      for (;;) { if (eat('+')) v += term(); else if (eat('-')) v -= term(); else return v; }
    }
    function term() {
      let v = factor();
      for (;;) {
        if (eat('*')) v *= factor();
        else if (eat('/')) v /= factor();
        else if (peek() === '(' || /[a-zπ√]/i.test(peek() || '')) v *= factor(); // implicit multiplication
        else return v;
      }
    }
    function factor() {
      if (eat('-')) return -factor();
      if (eat('+')) return factor();
      const b = postfix();
      if (eat('^')) return Math.pow(b, factor());
      return b;
    }
    function postfix() {
      let v = primary();
      for (;;) {
        if (eat('!')) v = fact(v);
        else if (eat('%')) v /= 100;
        else return v;
      }
    }
    function primary() {
      if (eat('(')) { const v = expr(); eat(')'); return v; }
      const num = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));

      if (id) {
        const name = id[0];
        if (name === 'pi') { i += 2; return Math.PI; }
        if (name === 'e' && s[i + 1] !== 'x') { i++; return Math.E; }

    id: 'calculator', name: 'Calculator', icon: 'calculator', category: 'Apps', width: 360, height: 560, minWidth: 300, minHeight: 440,
    desc: 'Standard and scientific calculator', keywords: 'math',
    launch(win) {
