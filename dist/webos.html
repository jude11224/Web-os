<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="WebOS — a complete desktop operating system that runs in your browser.">
  <meta name="theme-color" content="#0f172a">
  <title>WebOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Cpath d='M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 13h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
/* ============ WebOS core styles ============ */
:root {
  --accent: #3b82f6;
  --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --accent-text: #fff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
  --tb-h: 52px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e1f26;
  --surface-2: #26272f;
  --surface-3: #31323b;
  --hover: rgba(255, 255, 255, .07);
  --active: rgba(255, 255, 255, .12);
  --text: #eceef3;
  --text-dim: #9aa0ad;
  --border: rgba(255, 255, 255, .09);
  --border-strong: rgba(255, 255, 255, .16);
  --glass: rgba(28, 29, 36, .78);
  --glass-strong: rgba(32, 33, 41, .92);
  --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
  --titlebar: #1a1b21;
  --titlebar-focus: #22232b;
  --input: #16171c;
  --danger: #ef4444;
  --ok: #22c55e;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #e2e8f0;
  --surface: #ffffff;
  --surface-2: #f4f5f8;
  --surface-3: #e8eaef;
  --hover: rgba(0, 0, 0, .05);
  --active: rgba(0, 0, 0, .09);
  --text: #1c1d22;
  --text-dim: #646a77;
  --border: rgba(0, 0, 0, .09);
  --border-strong: rgba(0, 0, 0, .17);
  --glass: rgba(246, 247, 251, .8);
  --glass-strong: rgba(250, 250, 252, .94);
  --shadow: 0 18px 50px rgba(15, 23, 42, .25), 0 2px 8px rgba(15, 23, 42, .12);
  --titlebar: #eef0f4;
  --titlebar-focus: #f8f9fb;
  --input: #ffffff;
  --danger: #dc2626;
  --ok: #16a34a;
  color-scheme: light;
}
.no-glass { --glass: var(--surface); --glass-strong: var(--surface); }
.no-glass * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
.no-anim *, .no-anim *::before, .no-anim *::after { animation: none !important; transition: none !important; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font: 14px/1.4 var(--font);
  background: #000;
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
input, textarea, select, button { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--text-dim); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
.muted { color: var(--text-dim); }
body.dragging iframe { pointer-events: none; }
body.dragging { cursor: grabbing; }

/* ---------- Common controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 5px 14px; border-radius: 7px;
  background: var(--surface-3); color: var(--text); border: 1px solid var(--border);
  transition: background .12s, transform .08s, border-color .12s; white-space: nowrap;
}
.btn:hover { background: color-mix(in srgb, var(--surface-3) 80%, var(--text) 8%); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.small { min-height: 26px; padding: 2px 10px; font-size: 12px; }
.btn.icon-btn { padding: 0; width: 32px; min-width: 32px; }
.btn.link { background: none; border: 0; color: var(--text-dim); text-decoration: underline; }
.btn.active, .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.btn.wide { width: 100%; }
.input {
  min-height: 32px; padding: 5px 10px; border-radius: 7px; width: 100%;
  background: var(--input); border: 1px solid var(--border-strong); color: var(--text); outline: none;
  user-select: text; -webkit-user-select: text;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.input { padding-right: 4px; }
input[type="range"] { accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
.avatar {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
  color: #fff; font-weight: 700; flex-shrink: 0; background: #555;
}
.avatar.big { width: 104px; height: 104px; font-size: 44px; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
.avatar.add { background: rgba(255, 255, 255, .18); font-size: 28px; font-weight: 300; }
.icon-svg { display: block; }

/* ---------- Boot screen ---------- */
#boot {
  position: fixed; inset: 0; background: #05070d; color: #cbd5e1; z-index: 9000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .35s;
}
#boot.fade, #login.fade { opacity: 0; }
.boot-logo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 72px; height: 72px; }
.boot-logo i { border-radius: 6px; background: linear-gradient(135deg, #42a5f5, #7e57c2); animation: bootpulse 1.2s infinite ease-in-out; }
.boot-logo i:nth-child(2) { animation-delay: .15s; } .boot-logo i:nth-child(3) { animation-delay: .45s; } .boot-logo i:nth-child(4) { animation-delay: .3s; }
@keyframes bootpulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
.boot-name { font-size: 28px; font-weight: 300; letter-spacing: 6px; color: #fff; }
.boot-bar { width: 220px; height: 4px; border-radius: 4px; background: #1e293b; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #42a5f5, #7e57c2); transition: width .25s; }
.boot-msg { font-size: 12px; color: #64748b; height: 16px; }

/* ---------- Login / lock ---------- */
#login {
  position: fixed; inset: 0; z-index: 8000; color: #fff;
  background: radial-gradient(ellipse at 20% 0%, #2dd4bf44 0%, transparent 55%), radial-gradient(ellipse at 80% 30%, #a855f766 0%, transparent 50%), linear-gradient(160deg, #0f172a, #1e1b4b 50%, #0c4a6e);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
  transition: opacity .3s;
}
#login.lock { background: rgba(10, 12, 20, .55); backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); }
.login-clock { text-align: center; text-shadow: 0 2px 20px rgba(0, 0, 0, .3); }
.lc-time { font-size: 76px; font-weight: 200; line-height: 1; }
.lc-date { font-size: 18px; opacity: .85; margin-top: 6px; }
.login-panel {
  display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(340px, 90vw);
  padding: 26px; border-radius: 18px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.login-panel.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.login-name { font-size: 22px; font-weight: 500; }
.login-sub { font-size: 13px; opacity: .8; text-align: center; }
.login-row { display: flex; gap: 8px; width: 100%; }
.login-form { display: flex; flex-direction: column; gap: 8px; width: 100%; }
#login .input { background: rgba(0, 0, 0, .3); border-color: rgba(255, 255, 255, .2); color: #fff; }
#login .input::placeholder { color: rgba(255, 255, 255, .6); }
#login .btn.link { color: rgba(255, 255, 255, .8); }
.btn.arrow { width: 40px; padding: 0; font-size: 18px; }
.login-err { color: #fca5a5; font-size: 13px; min-height: 18px; text-align: center; }
.login-users { position: absolute; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; }
.lu { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 10px; color: #fff; text-align: left; }
.lu:hover { background: rgba(255, 255, 255, .12); }
.lu .avatar.add { font-size: 20px; }

/* ---------- Power screen ---------- */
#power-screen { position: fixed; inset: 0; z-index: 9500; background: #000; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; font-size: 16px; }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #334155; border-top-color: #93c5fd; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.off-msg { color: #f59e0b; font-family: var(--mono); }
.power-on { width: 84px; height: 84px; border-radius: 50%; color: #93c5fd; border: 2px solid #334155; display: grid; place-items: center; transition: .2s; }
.power-on:hover { background: #0f172a; color: #fff; box-shadow: 0 0 30px #3b82f655; }

/* ---------- Shell ---------- */
#shell { position: fixed; inset: 0; overflow: hidden; }
#wallpaper { position: absolute; inset: 0; background: darkslategrey; transition: background .4s; }
#desktop-icons { position: absolute; inset: 0 0 var(--tb-h) 0; overflow: hidden; }
#windows { position: absolute; inset: 0 0 var(--tb-h) 0; pointer-events: none; }
#windows > * { pointer-events: auto; }

.dicon {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 2px; border-radius: 8px; border: 1px solid transparent; cursor: default; outline: none;
  transition: left .15s var(--ease), top .15s var(--ease), background .1s;
}
.dicon:hover { background: rgba(255, 255, 255, .1); }
.dicon.sel { background: color-mix(in srgb, var(--accent) 35%, transparent); border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
.dicon.dragging { transition: none; opacity: .75; pointer-events: none; z-index: 5; }
.dicon.drop-hover, .drop-hover { background: color-mix(in srgb, var(--accent) 45%, transparent) !important; outline: 2px dashed var(--accent); }
.dicon-img { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .35)); display: grid; place-items: center; }
.dicon-img img { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; border: 2px solid #fff; }
.dicon-label {
  color: #fff; font-size: 12px; text-align: center; line-height: 1.25; word-break: break-word;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 2px rgba(0, 0, 0, .8);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.dicon.sel .dicon-label { -webkit-line-clamp: 5; }
.rubber { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 20%, transparent); pointer-events: none; }

/* ---------- Taskbar ---------- */
#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb-h); z-index: 5000;
  display: flex; align-items: center; padding: 0 6px; gap: 4px;
  background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-top: 1px solid var(--border);
}
#tb-left { display: flex; align-items: center; }
#tb-apps { display: flex; align-items: center; gap: 3px; flex: 1; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; height: 100%; }
#tb-apps::-webkit-scrollbar { display: none; }
[data-tbalign="center"] #tb-apps { justify-content: safe center; }
[data-tbalign="center"] #tb-left { position: static; }
#start-btn, .tb-app {
  position: relative; width: 44px; height: 42px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0;
  transition: background .12s, transform .1s;
}
#start-btn { color: var(--accent); }
#start-btn:hover, .tb-app:hover, #start-btn.active { background: var(--hover); }
#start-btn:active, .tb-app:active { transform: scale(.92); }
.tb-app.active { background: var(--active); }
.tb-dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 0; height: 3px; border-radius: 3px; background: var(--text-dim); transition: width .2s; }
.tb-app.running .tb-dot { width: 6px; }
.tb-app.active .tb-dot { width: 16px; background: var(--accent); }
.tb-app.multi .tb-dot { box-shadow: 8px 0 0 var(--text-dim); }
#tray { display: flex; align-items: center; gap: 2px; height: 100%; }
.tray-btn { height: 42px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; color: var(--text); }
.tray-btn:hover { background: var(--hover); }
#tb-clock { flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 1.3; min-width: 74px; }
#tb-clock small { font-size: 11px; color: var(--text-dim); }
#tb-notif-badge { position: absolute; top: 5px; right: 4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
#tb-desktop { width: 8px; height: 100%; border-left: 1px solid var(--border); margin-left: 4px; }
#tb-desktop:hover { background: var(--hover); }

/* ---------- Overlay panels ---------- */
.overlay-panel {
  position: absolute; bottom: calc(var(--tb-h) + 10px); z-index: 6000;
  background: var(--glass-strong); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
  border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(16px); pointer-events: none; visibility: hidden;
  transition: opacity .18s var(--ease), transform .22s var(--ease), visibility .22s;
}
.overlay-panel.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
#start-menu { left: 8px; width: min(600px, calc(100vw - 16px)); height: min(640px, calc(100vh - var(--tb-h) - 24px)); display: flex; flex-direction: column; }
[data-tbalign="center"] #start-menu { left: 50%; transform: translate(-50%, 16px); }
[data-tbalign="center"] #start-menu.open { transform: translate(-50%, 0); }
.sm-search { margin: 18px 22px 8px; width: auto; border-radius: 20px; padding-left: 16px; min-height: 38px; }
.sm-content { flex: 1; overflow-y: auto; padding: 4px 18px 16px; }
.sm-h { font-weight: 600; font-size: 13px; margin: 14px 6px 8px; color: var(--text-dim); }
.sm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 4px; }
.sm-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 8px; font-size: 12px; text-align: center; color: var(--text); }
.sm-tile:hover, .sm-row:hover { background: var(--hover); }
.sm-tile span { line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sm-list { display: flex; flex-direction: column; }
.sm-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-align: left; color: var(--text); width: 100%; }
.sm-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sm-row small { color: var(--text-dim); font-size: 11px; }
.sm-row.web { margin-top: 10px; border-top: 1px solid var(--border); border-radius: 0; padding-top: 12px; }
.sm-calc { padding: 12px 14px; margin: 10px 0 0; border-radius: 10px; background: var(--accent-soft); font-size: 16px; }
.sm-empty { padding: 30px; text-align: center; color: var(--text-dim); }
.sm-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; border-top: 1px solid var(--border); background: var(--hover); border-radius: 0 0 14px 14px; }
.sm-user { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 8px; color: var(--text); }
.sm-user:hover { background: var(--hover); }
.sm-power { display: flex; gap: 6px; }
.sm-power .btn { background: transparent; border: 0; }
.sm-power .btn:hover { background: var(--hover); }

#action-center { right: 8px; width: min(360px, calc(100vw - 16px)); max-height: calc(100vh - var(--tb-h) - 24px); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.qs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.qs-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border); font-size: 12px; color: var(--text); text-align: left; }
.qs-tile .qs-ico { font-size: 16px; }
.qs-tile.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.qs-slider { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.qs-slider input { flex: 1; }
.ac-head { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.ac-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 300px; }
.ac-note { display: flex; gap: 10px; padding: 10px; border-radius: 10px; background: var(--surface-3); cursor: pointer; font-size: 13px; }
.ac-note:hover { background: var(--active); }
.ac-note small { color: var(--text-dim); font-size: 11px; }
.ac-empty { color: var(--text-dim); padding: 20px; text-align: center; font-size: 13px; }

#cal-flyout { right: 8px; width: 320px; padding: 16px; }
.cf-big { padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 13px; }
.cf-time { font-size: 34px; font-weight: 300; color: var(--text); }
.cf-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cf-head .btn { background: transparent; border: 0; }
.cf-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cf-dow { font-size: 11px; color: var(--text-dim); padding: 4px 0; }
.cf-day { aspect-ratio: 1; border-radius: 50%; font-size: 13px; color: var(--text); position: relative; }
.cf-day:hover { background: var(--hover); }
.cf-day.today { background: var(--accent); color: var(--accent-text); font-weight: 700; }
.cf-day.has-ev::after { content: ''; position: absolute; bottom: 3px; left: 50%; margin-left: -2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cf-day.today.has-ev::after { background: #fff; }
.cf-events { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.cf-ev { padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--hover); border-radius: 4px; }

/* ---------- Windows ---------- */
.win {
  position: absolute; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; min-width: 200px;
  transition: opacity .16s, transform .18s var(--ease);
}
.win:not(.focused) { box-shadow: 0 8px 26px rgba(0, 0, 0, .3); }
.win.opening { animation: winopen .2s var(--ease); }
@keyframes winopen { from { opacity: 0; transform: scale(.94) translateY(8px); } }
.win.closing { opacity: 0; transform: scale(.94); pointer-events: none; }
.win.minimized { opacity: 0; transform: translateY(40px) scale(.85); pointer-events: none; visibility: hidden; transition: opacity .18s, transform .2s var(--ease), visibility 0s .2s; }
.win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; border: 0; }
.win-titlebar {
  height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding-left: 10px;
  background: var(--titlebar); border-bottom: 1px solid var(--border); cursor: default; touch-action: none;
}
.win.focused .win-titlebar { background: var(--titlebar-focus); }
.win-icon { display: grid; place-items: center; }
.win-title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
.win.focused .win-title { color: var(--text); }
.win-controls { display: flex; height: 100%; }
.wc { width: 44px; height: 100%; display: grid; place-items: center; color: var(--text-dim); transition: background .1s; }
.wc:hover { background: var(--hover); color: var(--text); }
.wc-close:hover { background: #e81123; color: #fff; }
.win-body { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.rz { position: absolute; z-index: 2; touch-action: none; }
.rz-n, .rz-s { left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.rz-n { top: -3px; } .rz-s { bottom: -3px; }

.ptool.active { background: var(--accent-soft); outline: 1px solid var(--accent); }
.paint-stage { flex: 1; overflow: auto; background: repeating-conic-gradient(var(--surface-3) 0 25%, var(--surface-2) 0 50%) 0 0 / 20px 20px; padding: 20px; }
.paint-inner { position: relative; box-shadow: 0 4px 20px rgba(0,0,0,.35); margin: auto; }
.paint-canvas, .paint-overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.paint-foot { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-top: 1px solid var(--border); flex-wrap: wrap; }
.paint-foot .statusbar { border: 0; margin-left: auto; }
.paint-palette { display: flex; gap: 3px; padding: 6px 8px; flex-wrap: wrap; }
.swatch { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border-strong); }
.swatch:hover { transform: scale(1.15); }

/* ============ Browser ============ */
.br-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; background: var(--titlebar); overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.br-tab { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 6px 0 10px; min-width: 60px; max-width: 200px; flex: 1 1 160px; border-radius: 8px 8px 0 0; font-size: 12px; color: var(--text-dim); cursor: default; }
.br-tab:hover { background: var(--hover); }
.br-tab.active { background: var(--surface-2); color: var(--text); }
.br-tab-t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-tab-x { width: 20px; height: 20px; border-radius: 50%; color: inherit; flex-shrink: 0; }
.br-tab-x:hover { background: var(--active); }
.br-fav.loading { animation: spin 1s linear infinite; }
.br-newtab { width: 30px; height: 30px; border-radius: 50%; font-size: 18px; color: var(--text-dim); flex-shrink: 0; margin-bottom: 1px; }
.br-newtab:hover { background: var(--hover); }
.br-nav { flex-wrap: nowrap; }
.br-url { flex: 1; border-radius: 18px; padding-left: 14px; }
.br-bookmarks { display: flex; gap: 2px; padding: 3px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.br-bm { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 12px; font-size: 12px; color: var(--text); white-space: nowrap; max-width: 180px; }
.br-bm span { overflow: hidden; text-overflow: ellipsis; }
.br-bm:hover { background: var(--hover); }
.br-hint { display: flex; align-items: center; gap: 10px; padding: 5px 10px; font-size: 12px; background: color-mix(in srgb, #f59e0b 18%, var(--surface)); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.br-hint span { flex: 1; }
.br-views { flex: 1; position: relative; min-height: 0; }
.br-view { position: absolute; inset: 0; display: flex; }
.br-frame { flex: 1; border: 0; background: #fff; width: 100%; height: 100%; }
.br-home { flex: 1; overflow-y: auto; background: radial-gradient(ellipse at top, var(--accent-soft), transparent 60%), var(--surface); }
.br-home-inner { max-width: 640px; margin: 0 auto; padding: 60px 20px 30px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.br-home h1 { font-weight: 400; font-size: 30px; text-align: center; }
.br-home-search { border-radius: 24px; min-height: 46px; padding: 0 20px; font-size: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
.br-quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; width: 100%; }
.br-quick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 12px; color: var(--text); font-size: 12px; }
.br-quick:hover { background: var(--hover); }
.br-quick-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 20px; font-weight: 700; }
.br-local { width: 100%; }
.br-local h3 { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }

/* ============ Photos ============ */
.ph-gallery { flex: 1; overflow-y: auto; padding: 16px 20px; }
.ph-g-head { display: flex; align-items: baseline; gap: 12px; }
.ph-g-dir { font-size: 13px; color: var(--text-dim); margin: 18px 0 8px; font-weight: 600; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ph-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-3); transition: transform .15s; }
.ph-thumb:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.ph-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-viewer { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #111; }
.ph-bar { background: var(--surface-2); }
.ph-info { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.ph-stage-wrap { flex: 1; position: relative; min-height: 0; }
.ph-stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; }
.ph-img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .12s ease-out; user-select: none; }
.ph-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border-radius: 10px; background: rgba(0,0,0,.4); color: #fff; font-size: 32px; opacity: 0; transition: opacity .15s; }
.ph-stage-wrap:hover .ph-arrow { opacity: 1; }
.ph-arrow.left { left: 10px; } .ph-arrow.right { right: 10px; }
.ph-strip { display: flex; gap: 6px; padding: 8px; overflow-x: auto; background: #0a0a0a; flex-shrink: 0; }
.ph-st { width: 64px; height: 48px; flex-shrink: 0; border-radius: 5px; overflow: hidden; opacity: .55; border: 2px solid transparent; }
.ph-st.active { opacity: 1; border-color: var(--accent); }
.ph-st img { width: 100%; height: 100%; object-fit: cover; }

/* ============ Music ============ */
.mu-side { width: 260px; padding: 10px; }
.mu-lib-h { display: flex; align-items: center; justify-content: space-between; padding: 4px; }
.mu-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border-radius: 8px; text-align: left; color: var(--text); }
.mu-row:hover { background: var(--hover); }
.mu-row.playing { background: var(--accent-soft); }
.mu-mini { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; display: grid; place-items: center; color: #fff; }
.mu-row-t { display: flex; flex-direction: column; min-width: 0; }
.mu-row-t span, .mu-row-t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mu-tip { font-size: 12px; padding: 8px 6px; }
.mu-main { flex: 1; display: flex; flex-direction: column; padding: 22px; gap: 14px; min-width: 0; background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
.mu-now { display: flex; align-items: center; gap: 20px; }
.mu-art { width: 120px; height: 120px; border-radius: 14px; display: grid; place-items: center; color: rgba(255,255,255,.9); box-shadow: 0 10px 30px rgba(0,0,0,.35); flex-shrink: 0; }
.mu-title { font-size: 24px; font-weight: 700; }
.mu-viz { flex: 1; width: 100%; min-height: 60px; }
.mu-seekrow { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.mu-seek { flex: 1; }
.mu-controls { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.mu-btn { width: 42px; height: 42px; border-radius: 50%; font-size: 18px; color: var(--text-dim); }
.mu-btn:hover { background: var(--hover); color: var(--text); }
.mu-btn.on { color: var(--accent); }
.mu-play { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 22px; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 50%, transparent); transition: transform .1s; }
.mu-play:hover { transform: scale(1.06); }
.mu-volwrap { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
.mu-vol { width: 90px; }

/* ============ Video ============ */
.vp { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; }
.vp-video { width: 100%; height: 100%; background: #000; }
.vp-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #ddd; text-align: center; padding: 20px; }
.vp-list { display: flex; gap: 4px; padding: 6px; overflow-x: auto; background: var(--surface-2); border-top: 1px solid var(--border); flex-shrink: 0; }
.vp-item { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--text); white-space: nowrap; }
.vp-item:hover { background: var(--hover); }

/* ============ Clock ============ */
.clk-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 16px; }
.clk-main { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.clk-face { width: min(240px, 50vw); height: auto; aspect-ratio: 1; }
.clk-digital { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; }
.clk-zones { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
.clk-zone { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
.clk-zone span { flex: 1; }
.clk-alarms { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; }
.clk-alarm { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface-2); border-radius: 12px; }
.clk-alarm.off { opacity: .55; }
.clk-alarm-t { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; }
.clk-add { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px dashed var(--border-strong); border-radius: 12px; }
.clk-add-row, .clk-days { display: flex; gap: 6px; flex-wrap: wrap; }
.clk-big { font-size: 56px; font-weight: 200; font-variant-numeric: tabular-nums; }
.clk-btns { display: flex; gap: 14px; }
.clk-laps { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
.clk-lap { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.clk-timer { position: relative; display: grid; place-items: center; width: 240px; height: 240px; }
.clk-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--accent) var(--p, 100%), var(--surface-3) 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%); mask: radial-gradient(circle, transparent 62%, #000 63%); }
.clk-timer .clk-big { font-size: 44px; }
.clk-presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* ============ Calendar ============ */
.cal-head { gap: 8px; }
.cal-title { font-size: 18px; font-weight: 600; margin-left: 8px; }
.cal-wrap { flex: 1; display: flex; min-height: 0; }
.cal-month { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 8px; }
.cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); gap: 3px; min-height: 0; }
.cal-dow { text-align: center; font-size: 12px; color: var(--text-dim); padding: 4px 0; font-weight: 600; }
.cal-cell { border-radius: 8px; background: var(--surface-2); padding: 4px 5px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; cursor: pointer; border: 2px solid transparent; min-height: 0; }
.cal-cell:hover { background: var(--surface-3); }
.cal-cell.other { opacity: .45; }
.cal-cell.sel { border-color: var(--accent); }
.cal-num { font-size: 13px; font-weight: 600; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cal-cell.today .cal-num { background: var(--accent); color: var(--accent-text); }
.cal-chip { font-size: 11px; color: #fff; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-more { font-size: 11px; color: var(--text-dim); }
.cal-side { width: 270px; border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: var(--surface-2); }
.cal-day-h { display: flex; align-items: center; gap: 12px; }
.cal-day-n { font-size: 40px; font-weight: 300; color: var(--accent); }
.cal-events { display: flex; flex-direction: column; gap: 6px; }
.cal-event { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--surface); border-left: 4px solid var(--accent); border-radius: 6px; }
.cal-note { font-size: 12px; margin-top: 4px; white-space: pre-wrap; }
.cal-form { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.cal-form textarea { resize: vertical; }
.cal-colors { display: flex; gap: 6px; }
.cal-color { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }
.cal-color.sel { border-color: var(--text); }

/* ============ Sticky notes ============ */
.nt-side { width: 240px; display: flex; flex-direction: column; }
.nt-side-h { display: flex; gap: 6px; padding: 8px; }
.nt-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.nt-item { text-align: left; padding: 10px; border-radius: 8px; background: var(--nc); color: #1f2937; display: flex; flex-direction: column; gap: 3px; border: 2px solid transparent; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.nt-item small { opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nt-item.active { border-color: var(--accent); }
.nt-editor { flex: 1; display: flex; flex-direction: column; background: var(--nc, var(--surface)); color: #1f2937; min-width: 0; }
.nt-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,.06); font-size: 12px; }
.nt-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); }
.nt-dot.sel { border-color: #1f2937; }
.nt-del { width: 30px; height: 30px; border-radius: 6px; }
.nt-del:hover { background: rgba(0,0,0,.1); }
.nt-text { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: #1f2937; padding: 16px 18px; font: 16px/1.6 var(--font); user-select: text; }
.nt-text::placeholder { color: rgba(0,0,0,.4); }

/* ============ Weather ============ */
.wx-search { position: relative; flex: 1; min-width: 160px; }
.wx-results { position: absolute; top: 36px; left: 0; right: 0; z-index: 10; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
.wx-res { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; color: var(--text); }
.wx-res:hover { background: var(--hover); }
.wx-cities { padding: 6px; }
.wx-city { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 8px 10px; border-radius: 8px; color: var(--text); text-align: left; }
.wx-city:hover { background: var(--hover); }
.wx-city.active { background: var(--accent-soft); }
.wx-main { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.wx-main.day.wx-clear { background: linear-gradient(180deg, #38bdf833, transparent 60%); }
.wx-main.day.wx-cloud { background: linear-gradient(180deg, #94a3b833, transparent 60%); }
.wx-main.wx-rain { background: linear-gradient(180deg, #475569aa, transparent 60%); }
.wx-main.night { background: linear-gradient(180deg, #1e1b4b, transparent 70%); }
.wx-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wx-hero h2 { font-size: 26px; }
.wx-temp { font-size: 72px; font-weight: 200; line-height: 1.1; }
.wx-emoji { font-size: 96px; line-height: 1; filter: drop-shadow(0 8px 20px rgba(0,0,0,.25)); }
.wx-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.wx-stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); }
.wx-main h4 { margin-top: 6px; color: var(--text-dim); font-size: 13px; }
.wx-hours { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
.wx-hour { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 52px; padding: 8px 4px; background: var(--surface-2); border-radius: 10px; font-size: 13px; }
.wx-he { font-size: 20px; }
.wx-bar { height: 72px; display: flex; align-items: flex-end; }
.wx-bar i { width: 6px; border-radius: 3px; background: linear-gradient(#f59e0b, #3b82f6); }
.wx-pp { color: #60a5fa; font-size: 11px; }
.wx-days { display: flex; flex-direction: column; gap: 4px; }
.wx-day { display: grid; grid-template-columns: 60px 30px 40px 40px 1fr 40px; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
.wx-range { height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; }
.wx-range i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #3b82f6, #f59e0b); }
.wx-credit { text-align: center; padding-top: 8px; }

/* ============ Task manager ============ */
.tm-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.tm-table { display: flex; flex-direction: column; }
.tm-row { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr; gap: 10px; padding: 6px 10px; align-items: center; border-radius: 6px; font-size: 13px; }
.tm-row:not(.tm-head):hover { background: var(--hover); }
.tm-row.sel { background: var(--accent-soft); }
.tm-head { font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); border-radius: 0; }
.tm-name { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
.tm-name span { overflow: hidden; text-overflow: ellipsis; }
.tm-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.tm-card { padding: 12px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.tm-card-h { display: flex; justify-content: space-between; }
.tm-graph { width: 100%; height: 100px; }
.tm-info { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tm-info > div { display: flex; flex-direction: column; padding: 10px; background: var(--surface-2); border-radius: 8px; }
.tm-bar-row { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 10px; padding: 4px; cursor: pointer; border-radius: 6px; font-size: 13px; }
.tm-bar-row:hover { background: var(--hover); }

/* ============ Settings ============ */
.st-nav { width: 230px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.st-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 16px; }
.st-user div { display: flex; flex-direction: column; }
.st-nav-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; color: var(--text); text-align: left; font-size: 13.5px; }
.st-nav-item:hover { background: var(--hover); }
.st-nav-item.active { background: var(--accent-soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.st-content { flex: 1; overflow-y: auto; padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.st-content h2 { font-size: 24px; font-weight: 600; }
.st-section { display: flex; flex-direction: column; gap: 2px; }
.st-section h3 { font-size: 14px; margin-bottom: 8px; }
.st-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 3px; flex-wrap: wrap; }
.st-row > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.st-preview { height: 150px; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid var(--border-strong); background-size: cover !important; background-position: center !important; max-width: 300px; }
.st-preview-win { position: absolute; left: 20%; top: 18%; width: 55%; height: 52%; border-radius: 6px; background: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.4); border-top: 10px solid var(--accent); }
.st-preview-tb { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--glass); }
.st-themes { display: flex; gap: 12px; }
.st-theme { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 10px; border: 2px solid var(--border); color: var(--text); }
.st-theme.sel { border-color: var(--accent); }
.st-theme-prev { width: 120px; height: 70px; border-radius: 6px; position: relative; overflow: hidden; }
.st-theme.light .st-theme-prev { background: #e2e8f0; } .st-theme.dark .st-theme-prev { background: #0f172a; }
.st-theme-prev i { position: absolute; left: 12px; right: 12px; height: 18px; border-radius: 4px; }
.st-theme-prev i:first-child { top: 12px; } .st-theme-prev i:last-child { top: 36px; right: 40px; }
.st-theme.light i { background: #fff; } .st-theme.dark i { background: #26272f; }
.st-accents { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.st-accent { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--border-strong); }
.st-accent.sel { border-color: var(--surface); box-shadow: 0 0 0 2px var(--text); }
.st-accents input[type=color] { width: 34px; height: 34px; border: 0; background: none; cursor: pointer; }
.st-wps { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.st-wp { aspect-ratio: 16/10; border-radius: 8px; border: 3px solid transparent; position: relative; overflow: hidden; background-size: cover !important; }
.st-wp span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px; font-size: 11px; color: #fff; background: rgba(0,0,0,.4); }
.st-wp.sel { border-color: var(--accent); }
.st-btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.st-appgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; }
.st-app { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--text); text-align: left; }
.st-app:hover { background: var(--hover); }
.st-form { display: flex; flex-direction: column; gap: 8px; max-width: 320px; padding: 12px 16px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }

.st-about { display: flex; align-items: center; gap: 16px; }

/* ============ About ============ */
.about { flex: 1; overflow-y: auto; padding: 24px 28px; }
.about-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.about-hero h1 { font-size: 30px; }
.about h3 { margin: 16px 0 8px; }
.about ul { padding-left: 20px; line-height: 1.7; font-size: 13.5px; }
.about-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; }
.about-app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 8px; font-size: 12px; color: var(--text); }
.about-app:hover { background: var(--hover); }

/* ============ Games: shared ============ */
.game { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #0b1220; color: #e5e7eb; }
.game-bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #111827; border-bottom: 1px solid #1f2937; flex-shrink: 0; flex-wrap: wrap; font-size: 13px; }
.game-bar .btn { background: #1f2937; color: #e5e7eb; border-color: #374151; }
.game-bar .input { background: #0b1220; color: #e5e7eb; border-color: #374151; }
.gb-score { font-weight: 700; }
.gb-best { color: #9ca3af; }
.game-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
.game-canvas { display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
.game-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2, 6, 23, .55); backdrop-filter: blur(3px); z-index: 20; animation: menuin .2s; }
.go-box { background: #111827ee; border: 1px solid #374151; border-radius: 16px; padding: 24px 30px; text-align: center; max-width: 86%; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.go-box h2 { font-size: 26px; margin-bottom: 6px; color: #fff; }
.go-box p { color: #cbd5e1; margin-bottom: 16px; }
.go-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.go-btns .btn { min-width: 110px; min-height: 38px; }

/* Minesweeper */
.ms-board { background: #c0c0c0; padding: 8px; border: 3px solid; border-color: #fff #7b7b7b #7b7b7b #fff; display: flex; flex-direction: column; gap: 8px; --cs: 28px; }
.ms-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border: 2px solid; border-color: #7b7b7b #fff #fff #7b7b7b; }
.ms-lcd { background: #000; color: #ef4444; font: 700 24px/1 ui-monospace, monospace; padding: 2px 4px; letter-spacing: 2px; min-width: 56px; text-align: center; }
.ms-face { font-size: 22px; width: 38px; height: 38px; border: 3px solid; border-color: #fff #7b7b7b #7b7b7b #fff; background: #c0c0c0; }
.ms-face:active { border-color: #7b7b7b #fff #fff #7b7b7b; }
.ms-grid { display: grid; border: 3px solid; border-color: #7b7b7b #fff #fff #7b7b7b; }
.ms-cell { width: var(--cs); height: var(--cs); background: #c0c0c0; border: 3px solid; border-color: #fff #7b7b7b #7b7b7b #fff; font: 800 calc(var(--cs) * .55)/1 system-ui, sans-serif; color: #000; padding: 0; display: grid; place-items: center; }
.ms-cell.open { border: 1px solid #9a9a9a; background: #d4d4d4; }
.ms-cell.flag { font-size: calc(var(--cs) * .5); }
.ms-cell.boom { background: #ef4444; }
.ms-cell[data-n="1"] { color: #1d4ed8; } .ms-cell[data-n="2"] { color: #15803d; } .ms-cell[data-n="3"] { color: #dc2626; } .ms-cell[data-n="4"] { color: #1e3a8a; }
.ms-cell[data-n="5"] { color: #7f1d1d; } .ms-cell[data-n="6"] { color: #0e7490; } .ms-cell[data-n="7"] { color: #000; } .ms-cell[data-n="8"] { color: #6b7280; }

/* 2048 */
.t2-wrap { display: grid; place-items: center; }
.t2-board { --size: 400px; --gap: calc(var(--size) * .03); --cell: calc((var(--size) - var(--gap) * 5) / 4); position: relative; width: var(--size); height: var(--size); background: #bbada0; border-radius: 10px; padding: var(--gap); display: grid; grid-template-columns: repeat(4, var(--cell)); gap: var(--gap); }
.t2-cell { background: rgba(238, 228, 218, .35); border-radius: 6px; }
.t2-tile { position: absolute; left: var(--gap); top: var(--gap); width: var(--cell); height: var(--cell); border-radius: 6px; display: grid; place-items: center; font: 800 calc(var(--cell) * .42)/1 system-ui, sans-serif; color: #776e65; background: #eee4da; transform: translate(calc(var(--x) * (var(--cell) + var(--gap))), calc(var(--y) * (var(--cell) + var(--gap)))); transition: transform .1s ease-in-out; }
.t2-tile.new { animation: t2pop .2s ease .1s backwards; }
.t2-tile.merged { animation: t2merge .18s ease .08s; }
@keyframes t2pop { from { opacity: 0; scale: .2; } }
@keyframes t2merge { 50% { scale: 1.18; } }
.t2-tile[data-v="4"] { background: #ede0c8; } .t2-tile[data-v="8"] { background: #f2b179; color: #f9f6f2; } .t2-tile[data-v="16"] { background: #f59563; color: #f9f6f2; }
.t2-tile[data-v="32"] { background: #f67c5f; color: #f9f6f2; } .t2-tile[data-v="64"] { background: #f65e3b; color: #f9f6f2; }
.t2-tile[data-v="128"] { background: #edcf72; color: #f9f6f2; font-size: calc(var(--cell) * .34); box-shadow: 0 0 20px #edcf7266; }
.t2-tile[data-v="256"] { background: #edcc61; color: #f9f6f2; font-size: calc(var(--cell) * .34); box-shadow: 0 0 24px #edcc6177; }
.t2-tile[data-v="512"] { background: #edc850; color: #f9f6f2; font-size: calc(var(--cell) * .34); box-shadow: 0 0 28px #edc85088; }
.t2-tile[data-v="1024"] { background: #edc53f; color: #f9f6f2; font-size: calc(var(--cell) * .28); box-shadow: 0 0 30px #edc53f99; }
.t2-tile[data-v="2048"] { background: #edc22e; color: #f9f6f2; font-size: calc(var(--cell) * .28); box-shadow: 0 0 34px #edc22eaa; }
.t2-tile[data-v="big"] { background: #3c3a32; color: #f9f6f2; font-size: calc(var(--cell) * .24); }

/* Solitaire */
.game-stage.sol-stage { background: radial-gradient(ellipse at center, #15803d, #14532d 80%); align-items: flex-start; justify-content: safe center; overflow: auto; }
.sol-table { --cw: 90px; --ch: 126px; padding: 16px; display: flex; flex-direction: column; gap: 18px; margin: 0 auto; }
.sol-row { display: flex; gap: calc(var(--cw) * .1); }
.sol-gap { width: var(--cw); }
.sol-slot { position: relative; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); flex-shrink: 0; }
.sol-stock, .sol-found, .sol-pile { box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
.sol-pile { box-shadow: none; }
.sol-pile::before { content: ''; position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.sol-stock { cursor: pointer; display: grid; place-items: center; }
.sol-recycle { color: rgba(255,255,255,.5); font-size: calc(var(--cw) * .45); }
.sol-ghost { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.2); font: 700 calc(var(--cw) * .4) system-ui; }
.sol-waste { width: calc(var(--cw) * 2.1); }
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); cursor: grab; user-select: none; font-family: Georgia, "Times New Roman", serif; touch-action: none; }
.card.red { color: #dc2626; } .card.black { color: #111827; }
.card.back { background: repeating-linear-gradient(45deg, #1d4ed8 0 6px, #2563eb 6px 12px); border: 4px solid #fff; cursor: default; }
.card .cr, .card .cr2 { position: absolute; font-size: calc(var(--cw) * .2); line-height: 1; text-align: center; font-weight: 700; }
.card .cr { left: 5%; top: 4%; }
.card .cr2 { right: 5%; bottom: 4%; transform: rotate(180deg); }
.card .cc { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .5); }
.card.dragging { z-index: 99999; cursor: grabbing; box-shadow: 0 12px 30px rgba(0,0,0,.45); pointer-events: none; }
.card.hint { animation: hint 1s; }
@keyframes hint { 0%, 100% { box-shadow: 0 1px 3px rgba(0,0,0,.4); } 30%, 70% { box-shadow: 0 0 0 4px #facc15, 0 0 20px #facc15; } }
.sol-confetti { position: absolute; inset: 0; pointer-events: none; z-index: 15; }

/* Tic-tac-toe */
.ttt { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.ttt-status { font-size: 18px; color: #cbd5e1; min-height: 26px; display: flex; align-items: center; gap: 8px; }
.ttt-grid { display: grid; grid-template-columns: repeat(3, min(26vmin, 100px)); gap: 8px; }
.ttt-cell { aspect-ratio: 1; border-radius: 14px; background: #1e293b; font: 800 min(16vmin, 60px)/1 system-ui; color: #fff; transition: background .15s, transform .1s; }
.ttt-cell:hover { background: #273449; }
.ttt-cell.x { color: #38bdf8; } .ttt-cell.o { color: #f472b6; }
.ttt-cell.x, .ttt-cell.o { animation: t2pop .18s; }
.ttt-cell.win { background: #facc15; color: #1e293b; }

/* Memory */
.mem-grid { display: grid; gap: 8px; perspective: 900px; }
.mem-card { position: relative; border-radius: 10px; padding: 0; }
.mem-inner { position: absolute; inset: 0; transition: transform .35s; transform-style: preserve-3d; }
.mem-card.up .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.mem-back { background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: inset 0 0 0 3px rgba(255,255,255,.25); }
.mem-back::after { content: '?'; color: rgba(255,255,255,.5); font: 800 1em system-ui; }
.mem-front { background: #f8fafc; transform: rotateY(180deg); }
.mem-card.done .mem-front { background: #bbf7d0; animation: t2merge .3s; }

/* Connect four */
.c4 { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.c4-board { --cs: 64px; display: flex; gap: 0; background: #1d4ed8; padding: 8px; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
.c4-col { display: flex; flex-direction: column; cursor: pointer; border-radius: 8px; }
.c4-col.hover { background: rgba(255,255,255,.12); }
.c4-cell { width: var(--cs); height: var(--cs); padding: calc(var(--cs) * .08); }
.c4-cell::before { content: ''; display: none; }
.c4-cell { background: radial-gradient(circle, #0b1220 calc(var(--cs) * .38), transparent calc(var(--cs) * .38 + 1px)); position: relative; }
.c4-disc { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.c4-disc.p1 { background: #ef4444; } .c4-disc.p2 { background: #facc15; }
.c4-disc.drop { animation: c4drop .35s cubic-bezier(.5,0,.75,0) backwards; }
@keyframes c4drop { from { transform: translateY(calc(var(--cs) * -1 * (var(--r) + 1.5))); } }
.c4-disc.win { animation: c4win .6s infinite alternate; }
@keyframes c4win { to { box-shadow: 0 0 0 4px #fff, 0 0 18px #fff; } }
.c4-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
.c4-dot.p1 { background: #ef4444; } .c4-dot.p2 { background: #facc15; }

/* Chess */
.ch { display: flex; gap: 18px; align-items: center; }
.ch-left { display: flex; flex-direction: column; gap: 4px; }
.ch-board { --sq: 60px; display: grid; grid-template-columns: repeat(8, var(--sq)); border-radius: 6px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
.ch-sq { width: var(--sq); height: var(--sq); position: relative; display: grid; place-items: center; cursor: pointer; }
.ch-sq.light { background: #eeeed2; } .ch-sq.dark { background: #769656; }
.ch-sq.last.light { background: #f6f669; } .ch-sq.last.dark { background: #baca2b; }
.ch-sq.sel { box-shadow: inset 0 0 0 4px #facc15; }
.ch-sq.check { background: radial-gradient(circle, #ef4444 20%, #b91c1c80 60%, transparent 75%) !important; }
.ch-sq.dot::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(0,0,0,.2); }
.ch-sq.cap::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--sq) * .08) solid rgba(0,0,0,.2); }
.ch-p { font-size: calc(var(--sq) * .8); line-height: 1; position: relative; z-index: 1; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", system-ui, sans-serif; }
.ch-p.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 2px 3px rgba(0,0,0,.5); -webkit-text-stroke: 1px #222; }
.ch-p.b { color: #1f2937; text-shadow: 0 1px 2px rgba(255,255,255,.3); }
.ch-coord { position: absolute; font: 700 calc(var(--sq) * .18) system-ui; opacity: .75; }
.ch-sq.light .ch-coord { color: #769656; } .ch-sq.dark .ch-coord { color: #eeeed2; }
.ch-coord.f { right: 3px; bottom: 1px; } .ch-coord.r { left: 3px; top: 1px; }
.ch-cap { min-height: 26px; display: flex; align-items: center; gap: 0; font-size: 13px; color: #9ca3af; }
.ch-cap .ch-p { font-size: 20px; margin-right: -4px; }
.ch-side { width: 180px; display: flex; flex-direction: column; gap: 8px; align-self: stretch; max-height: calc(var(--sq, 60px) * 8 + 60px); }
.ch-status { font-weight: 600; padding: 8px 10px; background: #1e293b; border-radius: 8px; font-size: 13px; }
.ch-moves { flex: 1; overflow-y: auto; background: #111827; border-radius: 8px; padding: 6px; font: 13px var(--mono); min-height: 120px; }
.ch-mv { display: grid; grid-template-columns: 34px 1fr 1fr; padding: 2px 4px; }
.ch-mv:nth-child(odd) { background: #1f2937; border-radius: 4px; }
.ch-narrow .ch-side { display: none; }

@media (max-width: 700px) {
  .app-side { width: 150px; }
  .fx-side, .cs-side { display: none; }
  .cal-side { width: 200px; }
  .mu-side { width: 180px; }
  .st-nav { width: 64px; }
  .st-nav-item span, .st-user div { display: none; }
  .st-content { padding: 16px; }
  .fx-search { width: 100px; }
  .cs-preview { width: 50%; }
}

  <!-- Core -->
  <script>/* js/core/util.js */
/* WebOS core utilities, event bus, storage and sound */
'use strict';

const OS = window.OS = {
  name: 'WebOS',
  version: '1.0.0',
  apps: {},
  bootTime: Date.now(),
};

/* ---------- Event bus ---------- */
OS.bus = (() => {
  const map = {};
  return {
    on(evt, fn) { (map[evt] = map[evt] || []).push(fn); return () => this.off(evt, fn); },
    off(evt, fn) { map[evt] = (map[evt] || []).filter(f => f !== fn); },
    emit(evt, ...args) {
      (map[evt] || []).slice().forEach(fn => {
        try { fn(...args); } catch (err) { console.error('[bus]', evt, err); }
      });
    },
  };
})();

/* ---------- Helpers ---------- */
const U = OS.util = {
  /** Small DOM builder: h('div', {class:'x', onclick: fn}, 'text', childNode) */
  h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (sk.startsWith('--')) el.style.setProperty(sk, sv);
            else el.style[sk] = sv;
          }
        }
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    const add = c => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add);
      else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    };
    children.forEach(add);
    return el;
  },
  /** Like Element.append but skips null/false and flattens arrays */
  append(parent, ...kids) {
    const add = c => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else parent.append(c); };
    kids.forEach(add);
    return parent;
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; },
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  },
  pad(n, l = 2) { return String(n).padStart(l, '0'); },
  debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  },
  fmtBytes(n) {
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB'];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
  },
  fmtDate(t) {
    const d = new Date(t);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  },
  fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return (h ? h + ':' + U.pad(m) : m) + ':' + U.pad(s);
  },
  ext(name) {
    const m = /\.([^./]+)$/.exec(name || '');
    return m ? m[1].toLowerCase() : '';

  imageExts: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'ico', 'avif'],
  audioExts: ['mp3', 'wav', 'ogg', 'oga', 'm4a', 'aac', 'flac', 'opus'],
  videoExts: ['mp4', 'webm', 'mov', 'm4v', 'ogv', 'mkv'],
  isText(name) { return U.textExts.includes(U.ext(name)); },
  /** Read a host File as text (for text types) or a data URL */
  readHostFile(file) {
    return new Promise((res, rej) => {

      const asText = U.isText(file.name) || (file.type && file.type.startsWith('text/') && !file.name.endsWith('.svg'));

      js: 'text/javascript', json: 'application/json', svg: 'image/svg+xml', png: 'image/png',
      jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', mp3: 'audio/mpeg',
      wav: 'audio/wav', ogg: 'audio/ogg', mp4: 'video/mp4', webm: 'video/webm', pdf: 'application/pdf',

  contentToBlob(content, name) {

  async sha256(text) {

      else if (!line.trim()) { closeList(); }
      else { closeList(); html += `<p>${inline(line)}</p>`; }
    }
    if (inCode) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;

/* ---------- Persistent key/value storage (localStorage) ---------- */
OS.storage = {
  get(key, def) {
    try {
      const v = localStorage.getItem('webos.' + key);
      return v == null ? def : JSON.parse(v);
    } catch { return def; }
  },
  set(key, val) {
    try { localStorage.setItem('webos.' + key, JSON.stringify(val)); return true; }
    catch (e) { console.warn('storage full', e); OS.notify && OS.notify({ title: 'Storage full', body: 'Could not save data: the browser storage quota was exceeded.' }); return false; }
  },
  remove(key) { try { localStorage.removeItem('webos.' + key); } catch { /* ignore */ } },
  keys(prefix) {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('webos.' + prefix)) out.push(k.slice(6));
      }
    } catch { /* ignore */ }
    return out;
  },
};

/** Per-user app data (high scores, notes, events...) */
OS.data = {
  get(key, def) { return OS.storage.get('data.' + OS.user.username + '.' + key, def); },
  set(key, val) { return OS.storage.set('data.' + OS.user.username + '.' + key, val); },
};

/* ---------- IndexedDB key/value (large data like the file system) ---------- */
OS.idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no indexedDB'));
    const r = indexedDB.open('webos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode);
      const req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    async get(k) {
      try { return await tx('readonly', s => s.get(k)); }
      catch { return OS.storage.get('idb.' + k); }
    },
    async set(k, v) {
      try { await tx('readwrite', s => s.put(v, k)); }
      catch { OS.storage.set('idb.' + k, v); }
    },
    async del(k) {
      try { await tx('readwrite', s => s.delete(k)); }
      catch { OS.storage.remove('idb.' + k); }
    },
  };
})();

/* ---------- Sounds (synthesized with WebAudio, no assets needed) ---------- */
OS.sound = (() => {
  let ctx = null;
  const getCtx = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const vol = () => (OS.settings ? (OS.settings.get('volume') ?? 70) / 100 : 0.7);
  const enabled = () => !OS.settings || OS.settings.get('sounds') !== false;
  const tone = (freq, start, dur, type = 'sine', gain = 0.2) => {
    const c = getCtx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    const t = c.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain * vol(), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  };
  const sounds = {
    startup() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.12, 0.9 - i * 0.1, 'sine', 0.15)); tone(261.63, 0, 1.2, 'triangle', 0.1); },
    shutdown() { [783.99, 659.25, 523.25, 392].forEach((f, i) => tone(f, i * 0.14, 0.6, 'sine', 0.15)); },
    notify() { tone(880, 0, 0.18, 'sine', 0.15); tone(1318.5, 0.09, 0.3, 'sine', 0.12); },
    error() { tone(220, 0, 0.25, 'square', 0.08); tone(196, 0.12, 0.3, 'square', 0.08); },
    click() { tone(1200, 0, 0.04, 'square', 0.03); },
    pop() { tone(660, 0, 0.08, 'triangle', 0.15); },
    coin() { tone(988, 0, 0.08, 'square', 0.07); tone(1319, 0.07, 0.25, 'square', 0.07); },
    hit() { tone(140, 0, 0.15, 'sawtooth', 0.12); },
    blip() { tone(520, 0, 0.06, 'square', 0.06); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.25, 'triangle', 0.15)); },
    lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, i * 0.16, 0.35, 'triangle', 0.15)); },
    alarm() { for (let i = 0; i < 6; i++) { tone(880, i * 0.5, 0.2, 'square', 0.1); tone(880, i * 0.5 + 0.25, 0.2, 'square', 0.1); } },
  };
  return {
    play(name) { if (enabled() && sounds[name]) try { sounds[name](); } catch { /* ignore */ } },
    tone(...a) { if (enabled()) tone(...a); },
    ctx: getCtx,
  };
})();

    if (U.textExts.includes(e)) return 'filetext';
    if (e === 'lnk') return 'file';
    return 'file';
  }

  const has = name => !!defs[name];

/* WebOS virtual file system — per-user tree kept in memory and persisted to IndexedDB.
 * Node shapes:  dir  { t:'d', c:{ name: node }, m: mtime }
 *               file { t:'f', d: 'text or data:URL', m: mtime }
 * The user's home is the root "/". Trash lives in "/.Trash".
 */
'use strict';

class VFS {
  constructor(user, tree) {
    this.user = user;
    this.root = tree;
    this._save = U.debounce(() => this.flush(), 400);
  }

  static async open(user) {
    let tree = await OS.idb.get('fs:' + user);
    const fs = new VFS(user, tree || VFS.defaultTree(user));
    if (!tree) fs.flush();
    if (!fs.root.c['.Trash']) fs.root.c['.Trash'] = VFS.dir();
    return fs;
  }

  static dir(children = {}) { return { t: 'd', c: children, m: Date.now() }; }
  static file(data = '') { return { t: 'f', d: data, m: Date.now() }; }

  static defaultTree(user) {
    const f = VFS.file, d = VFS.dir;
    const sampleSvg = 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8b"/><stop offset=".55" stop-color="#ff6a88"/><stop offset="1" stop-color="#5b247a"/></linearGradient></defs><rect width="800" height="500" fill="url(#s)"/><circle cx="560" cy="250" r="90" fill="#ffe29f" opacity=".95"/><path d="M0 330 L140 220 L260 300 L380 180 L520 320 L640 240 L800 330 V500 H0z" fill="#3a1c71" opacity=".85"/><path d="M0 390 L180 300 L330 380 L470 290 L620 380 L800 320 V500 H0z" fill="#24124a"/></svg>`);
    const sampleSvg2 = 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><defs><radialGradient id="g" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#43cea2"/><stop offset="1" stop-color="#185a9d"/></radialGradient></defs><rect width="800" height="500" fill="url(#g)"/>${Array.from({ length: 24 }, (_, i) => `<circle cx="${(i * 97) % 800}" cy="${(i * 53) % 500}" r="${10 + (i * 7) % 40}" fill="#fff" opacity="${0.05 + (i % 5) * 0.04}"/>`).join('')}<text x="400" y="270" font-family="sans-serif" font-size="64" font-weight="700" fill="#fff" text-anchor="middle">Bubbles</text></svg>`);
    return d({
      Desktop: d({
        'Welcome.txt': f(`Welcome to WebOS, ${user}!\n\nThis is a complete desktop operating system that runs entirely in your browser.\n\nThings to try:\n  • Open the Start menu (bottom-left) to find every app and game.\n  • Drag windows around, resize them, snap them to the screen edges.\n  • Right-click the desktop to create files and folders.\n  • Open Terminal and type "help".\n  • Change your wallpaper and theme in Settings.\n  • Drop files from your real computer onto the desktop to import them.\n\nEverything you create is saved in your browser, per user account.\n\nHave fun!\n`),
      }),
      Documents: d({
        'Notes.md': f(`# My Notes\n\nThis is a **Markdown** file. Open it in *Notepad* and press **Preview**.\n\n## Todo\n- Try every game\n- Beat my Snake high score\n- Write some code in Code Studio\n\n> Tip: Ctrl+S saves in most apps.\n`),
        'hello.html': f(`<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello</title>\n  <style>\n    body { font-family: sans-serif; display: grid; place-items: center; height: 100vh; margin: 0;\n           background: linear-gradient(135deg, #667eea, #764ba2); color: white; }\n    button { font-size: 18px; padding: 10px 20px; border-radius: 8px; border: 0; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <div style="text-align:center">\n    <h1>Hello from WebOS!</h1>\n    <p>Edit this file in Code Studio and press Run.</p>\n    <button onclick="this.textContent = 'Clicked ' + (++n) + ' times'">Click me</button>\n  </div>\n  <script>let n = 0;<\/script>\n</body>\n</html>\n`),
        'script.js': f(`// Open in Code Studio and press Run (F5).\n// console.log output appears in the console panel.\n\nfunction fib(n) {\n  return n < 2 ? n : fib(n - 1) + fib(n - 2);\n}\n\nfor (let i = 0; i < 10; i++) {\n  console.log('fib(' + i + ') =', fib(i));\n}\n`),
        'shopping.csv': f('item,qty,price\napples,6,0.5\nbread,1,2.25\nmilk,2,1.1\n'),
      }),
      Pictures: d({ 'Sunset.svg': f(sampleSvg), 'Bubbles.svg': f(sampleSvg2) }),
      Music: d({}),
      Videos: d({}),
      Downloads: d({}),
      '.Trash': d({}),
    });
  }

  flush() {
    return OS.idb.set('fs:' + this.user, this.root);
  }

  changed(...paths) {
    this._save();
    OS.bus.emit('fs:change', paths);
  }

  resolve(path, cwd = '/') {
    if (path == null || path === '') return cwd;
    path = String(path);
    if (path === '~' || path.startsWith('~/')) path = '/' + path.slice(1);
    const full = path.startsWith('/') ? path : cwd + '/' + path;
    const out = [];
    for (const p of full.split('/')) {
      if (!p || p === '.') continue;
      if (p === '..') out.pop();
      else out.push(p);
    }
    return '/' + out.join('/');
  }

  node(path) {
    const parts = this.resolve(path).split('/').filter(Boolean);
    let n = this.root;
    for (const p of parts) {
      if (!n || n.t !== 'd' || !Object.prototype.hasOwnProperty.call(n.c, p)) return null;
      n = n.c[p];
    }
    return n;
  }

  exists(path) { return !!this.node(path); }
  isDir(path) { const n = this.node(path); return !!n && n.t === 'd'; }
  isFile(path) { const n = this.node(path); return !!n && n.t === 'f'; }

  _parent(path, create = false) {
    path = this.resolve(path);
    if (path === '/') throw new Error('Cannot modify root');
    const dir = U.dirname(path), name = U.basename(path);
    let p = this.node(dir);
    if (!p && create) { this.mkdir(dir, true); p = this.node(dir); }
    if (!p) throw new Error(`No such directory: ${dir}`);
    if (p.t !== 'd') throw new Error(`Not a directory: ${dir}`);
    return { parent: p, name, dir, path };
  }

  static validName(name) {
    return !!name && !/[/\\]/.test(name) && name !== '.' && name !== '..' && name.length < 200;
  }

  size(node) {
    if (!node) return 0;
    if (node.t === 'f') {
      const d = node.d || '';
      if (d.startsWith('data:')) {
        const i = d.indexOf(',');
        return d.slice(0, i).includes('base64') ? Math.floor((d.length - i - 1) * 3 / 4) : d.length - i - 1;
      }
      return new Blob([d]).size;
    }
    return Object.values(node.c).reduce((a, n) => a + this.size(n), 0);
  }

  stat(path) {
    path = this.resolve(path);
    const n = this.node(path);
    if (!n) return null;
    return {
      name: U.basename(path), path, type: n.t === 'd' ? 'dir' : 'file', isDir: n.t === 'd',
      size: this.size(n), mtime: n.m, count: n.t === 'd' ? Object.keys(n.c).length : 0, origin: n.o,
    };
  }

  list(path, { hidden = false } = {}) {
    path = this.resolve(path);
    const n = this.node(path);
    if (!n) throw new Error(`No such directory: ${path}`);
    if (n.t !== 'd') throw new Error(`Not a directory: ${path}`);
    return Object.keys(n.c)
      .filter(name => hidden || !name.startsWith('.'))
      .map(name => this.stat(U.join(path, name)))
      .sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  }

  read(path) {
    const n = this.node(path);
    if (!n) throw new Error(`No such file: ${path}`);
    if (n.t !== 'f') throw new Error(`Is a directory: ${path}`);
    return n.d;
  }

  write(path, data, { createDirs = false } = {}) {
    const { parent, name, dir, path: full } = this._parent(path, createDirs);
    if (!VFS.validName(name)) throw new Error(`Invalid name: ${name}`);
    const ex = parent.c[name];
    if (ex && ex.t === 'd') throw new Error(`Is a directory: ${full}`);
    if (ex) { ex.d = String(data ?? ''); ex.m = Date.now(); }
    else parent.c[name] = VFS.file(String(data ?? ''));
    parent.m = Date.now();
    this.changed(dir, full);
    return full;
  }

  append(path, data) {
    const cur = this.isFile(path) ? this.read(path) : '';
    return this.write(path, cur + data);
  }

  mkdir(path, recursive = false) {
    path = this.resolve(path);
    if (path === '/') return path;
    if (recursive) {
      let cur = '';
      for (const p of path.split('/').filter(Boolean)) {
        cur += '/' + p;
        const n = this.node(cur);
        if (!n) this.mkdir(cur);
        else if (n.t !== 'd') throw new Error(`Not a directory: ${cur}`);
      }
      return path;
    }
    const { parent, name, dir } = this._parent(path);
    if (!VFS.validName(name)) throw new Error(`Invalid name: ${name}`);
    if (parent.c[name]) throw new Error(`Already exists: ${path}`);
    parent.c[name] = VFS.dir();
    parent.m = Date.now();
    this.changed(dir, path);
    return path;
  }

  remove(path) {
    const { parent, name, dir, path: full } = this._parent(path);
    if (!parent.c[name]) throw new Error(`No such file or directory: ${full}`);
    if (full === '/.Trash') throw new Error('Cannot remove the Trash');
    delete parent.c[name];
    parent.m = Date.now();
    this.changed(dir, full);
  }

  move(src, dst) {
    src = this.resolve(src);
    dst = this.resolve(dst);
    if (this.isDir(dst)) dst = U.join(dst, U.basename(src));
    if (src === dst) return dst;
    if (dst.startsWith(src + '/')) throw new Error('Cannot move a folder into itself');
    const s = this._parent(src);
    const node = s.parent.c[s.name];
    if (!node) throw new Error(`No such file or directory: ${src}`);
    const d = this._parent(dst);
    if (!VFS.validName(d.name)) throw new Error(`Invalid name: ${d.name}`);
    if (d.parent.c[d.name]) throw new Error(`Already exists: ${dst}`);
    delete s.parent.c[s.name];
    node.m = Date.now();
    d.parent.c[d.name] = node;
    this.changed(s.dir, d.dir, src, dst);
    return dst;
  }

  rename(path, newName) {
    if (!VFS.validName(newName)) throw new Error(`Invalid name: ${newName}`);
    return this.move(path, U.join(U.dirname(this.resolve(path)), newName));
  }

  copy(src, dst) {
    src = this.resolve(src);
    dst = this.resolve(dst);
    if (this.isDir(dst)) dst = U.join(dst, U.basename(src));
    if (dst.startsWith(src + '/')) throw new Error('Cannot copy a folder into itself');
    const node = this.node(src);
    if (!node) throw new Error(`No such file or directory: ${src}`);
    const d = this._parent(dst);
    if (d.parent.c[d.name]) throw new Error(`Already exists: ${dst}`);
    const clone = JSON.parse(JSON.stringify(node));
    clone.m = Date.now();
    delete clone.o;
    d.parent.c[d.name] = clone;
    this.changed(d.dir, dst);
    return dst;
  }

  /** "name.txt" -> "name (2).txt" if taken */
  uniqueName(dir, name) {
    if (!this.exists(U.join(dir, name))) return name;
    const e = U.ext(name), base = e ? name.slice(0, -(e.length + 1)) : name;
    for (let i = 2; ; i++) {
      const cand = `${base} (${i})${e ? '.' + e : ''}`;
      if (!this.exists(U.join(dir, cand))) return cand;
    }
  }

  trash(path) {
    path = this.resolve(path);
    if (path.startsWith('/.Trash')) { this.remove(path); return null; }
    const name = this.uniqueName('/.Trash', U.basename(path));
    const dst = this.move(path, U.join('/.Trash', name));
    this.node(dst).o = path;
    this._save();
    return dst;
  }

  restore(trashPath) {
    const n = this.node(trashPath);
    if (!n) throw new Error('Not found');
    const orig = n.o || U.join('/', U.basename(trashPath));
    const dir = U.dirname(orig);
    this.mkdir(dir, true);
    const dst = U.join(dir, this.uniqueName(dir, U.basename(orig)));
    this.move(trashPath, dst);
    delete this.node(dst).o;
    return dst;
  }

  emptyTrash() {
    this.root.c['.Trash'] = VFS.dir();
    this.changed('/.Trash');
  }

  /** Recursively find entries whose name contains query */
  find(query, start = '/', limit = 200) {
    const q = query.toLowerCase(), out = [];
    const walk = (path, node) => {
      for (const [name, child] of Object.entries(node.c)) {
        if (out.length >= limit) return;
        if (name === '.Trash') continue;
        const p = U.join(path, name);
        if (name.toLowerCase().includes(q)) out.push(this.stat(p));
        if (child.t === 'd') walk(p, child);
      }
    };
    const s = this.node(start);
    if (s && s.t === 'd') walk(this.resolve(start), s);
    return out;
  }

  usage() { return this.size(this.root); }

  /** Import host File objects into a directory */
  async importFiles(files, dir) {
    const out = [];
    for (const file of files) {
      try {
        const data = await U.readHostFile(file);
        const name = this.uniqueName(dir, file.name);
        out.push(this.write(U.join(dir, name), data));
      } catch (e) {
        OS.notify({ title: 'Import failed', body: `${file.name}: ${e.message}` });
      }
    }
    return out;
  }
}

OS.VFS = VFS;
