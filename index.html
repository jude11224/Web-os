<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="WebOS — a complete desktop operating system that runs in your browser.">
  <meta name="theme-color" content="#0f172a">
  <title>WebOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Cpath d='M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 13h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/os.css">
  <link rel="stylesheet" href="css/apps.css">
</head>
<body>
  <!-- Boot screen -->
  <div id="boot" hidden>
    <div class="boot-logo"><i></i><i></i><i></i><i></i></div>
    <div class="boot-name">WebOS</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-msg">Starting…</div>
  </div>

  <!-- Login / lock screen -->
  <div id="login" hidden></div>

  <!-- Desktop shell -->
  <div id="shell" hidden>
    <div id="wallpaper"></div>
    <div id="desktop-icons"></div>
    <div id="windows"></div>
    <div id="snap-preview"></div>

    <div id="start-menu" class="overlay-panel"></div>
    <div id="action-center" class="overlay-panel"></div>
    <div id="cal-flyout" class="overlay-panel"></div>

    <div id="taskbar">
      <div id="tb-left">
        <button id="start-btn" title="Start (Ctrl+Space)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="tb-apps"></div>
      <div id="tray">
        <button id="tb-notif" class="tray-btn" title="Quick settings &amp; notifications">
          <svg viewBox="0 0 24 24" width="18" height="18"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></g></svg>
          <span id="tb-notif-badge"></span>
        </button>
        <button id="tb-clock" class="tray-btn" title="Calendar"></button>
        <button id="tb-desktop" title="Show desktop"></button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="menus"></div>
  <div id="power-screen" hidden></div>
  <noscript><div style="padding:40px;font:16px sans-serif">WebOS needs JavaScript enabled to run.</div></noscript>

  <!-- Core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/fs.js"></script>
  <script src="js/core/wm.js"></script>
  <script src="js/core/system.js"></script>
  <script src="js/core/fileops.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/core/session.js"></script>

  <!-- Apps -->
  <script src="js/apps/files.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/code.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/paint.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/photos.js"></script>
  <script src="js/apps/music.js"></script>
  <script src="js/apps/video.js"></script>
  <script src="js/apps/clock.js"></script>
  <script src="js/apps/calendar.js"></script>
  <script src="js/apps/notes.js"></script>
  <script src="js/apps/weather.js"></script>
  <script src="js/apps/taskmgr.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/about.js"></script>

  <!-- Games -->
  <script src="js/games/snake.js"></script>
  <script src="js/games/tetris.js"></script>
  <script src="js/games/minesweeper.js"></script>
  <script src="js/games/2048.js"></script>
  <script src="js/games/solitaire.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/breakout.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/flappy.js"></script>
  <script src="js/games/pong.js"></script>
  <script src="js/games/connect4.js"></script>
  <script src="js/games/chess.js"></script>

  <script>OS.session.boot();</script>
</body>
</html>
